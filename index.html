<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EPS Flipbook Viewer</title>
  <style>
    :root{
      --bg1:#071024; --bg2:#0a1633;
      --card:#0b1220; --card2:#0f1a2e;
      --line:rgba(255,255,255,.08);
      --txt:#e5e7eb; --muted:#94a3b8;
      --btn:#111c33; --btn2:#152449;
      --accent:#60a5fa;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Pretendard,sans-serif;
      background:radial-gradient(1200px 600px at 40% 20%, rgba(96,165,250,.18), transparent 60%),
                 linear-gradient(180deg,var(--bg1),var(--bg2));
      color:var(--txt);
    }

    /* ✅ 16:9 프레임: WP의 Summary와 같은 방식으로 꽉 차게 */
    .stage{
      width:min(1200px, 96vw);
      margin:24px auto;
      padding:18px;
      border-radius:18px;
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid var(--line);
      box-shadow:0 18px 60px rgba(0,0,0,.35);
    }

    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      gap:14px;
      padding:14px 14px 12px;
      border-radius:14px;
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border:1px solid var(--line);
    }
    .title{
      font-weight:900;
      letter-spacing:.2px;
      font-size:14px;
      color:#fff;
      display:flex; gap:10px; align-items:center;
    }
    .title small{
      color:var(--muted);
      font-weight:800;
      opacity:.95;
    }

    .ctrl{
      display:flex; align-items:center; gap:10px;
      user-select:none;
    }
    .btn{
      border:1px solid var(--line);
      background:linear-gradient(180deg, var(--btn2), var(--btn));
      color:#fff;
      padding:10px 14px;
      border-radius:999px;
      font-weight:900;
      cursor:pointer;
      min-width:92px;
    }
    .btn:disabled{opacity:.35; cursor:not-allowed}
    .pill{
      border:1px solid var(--line);
      background:rgba(0,0,0,.22);
      padding:10px 14px;
      border-radius:999px;
      font-weight:900;
      color:#fff;
      min-width:92px;
      text-align:center;
    }

    .frame{
      margin-top:14px;
      border-radius:16px;
      overflow:hidden;
      border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.15));
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.03);
    }

    /* 16:9 유지 */
    .ratio{
      position:relative;
      width:100%;
      padding-bottom:56.25%;
      background:#000;
    }
    canvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      background:#000;
    }

    .footer{
      text-align:center;
      padding:10px 0 2px;
      font-size:12px;
      color:var(--muted);
      font-weight:800;
    }

    .toast{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      background:rgba(12,18,32,.9);
      border:1px solid var(--line);
      padding:14px 16px;
      border-radius:14px;
      width:min(520px, 86vw);
      text-align:center;
      box-shadow:0 12px 40px rgba(0,0,0,.45);
      display:none;
    }
