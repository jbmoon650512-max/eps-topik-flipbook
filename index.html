<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EPS / TOPIK II Flipbook Viewer</title>

  <!-- pdf.js (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.js"></script>

  <style>
    :root{
      --bg:#070b12;
      --frame:#000;
      --btnSize:36px;
      --btnBg: rgba(255,255,255,0.85);
      --btnFg: rgba(15,23,42,0.95);
      --pillBg: rgba(255,255,255,0.14);
      --pillFg: rgba(255,255,255,0.55);
      --pillBd: rgba(255,255,255,0.12);
    }
    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      overflow:hidden;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Pretendard,sans-serif;
    }
    .wrap{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--bg);
    }
    /* “검은 배경은 프레임 역할만” */
    .stage{
      position:relative;
      width:100%;
      height:100%;
      background:var(--frame);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    /* 캔버스는 화면의 주인공 */
    canvas{
      display:block;
      background:transparent;
      box-shadow:0 10px 28px rgba(0,0,0,0.35);
      border-radius:10px;
    }

    /* 버튼: 36px, 하단 좌/우, 텍스트 없음 */
    .navBtn{
      position:absolute;
      bottom:12px;
      width:var(--btnSize);
      height:var(--btnSize);
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.18);
      background:var(--btnBg);
      color:var(--btnFg);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
      box-shadow:0 10px 24px rgba(0,0,0,0.25);
      transform:translateZ(0);
    }
    .navBtn:active{ transform:translateZ(0) scale(0.98); }
    .navBtn[disabled]{
      opacity:0.35;
      cursor:not-allowed;
    }
    #prevBtn{ left:12px; }
    #nextBtn{ right:12px; }

    /* 아이콘(< >)만 */
    .navIcon{
      font-size:18px;
      font-weight:900;
      line-height:1;
      transform:translateY(-1px);
    }

    /* Page x / y : 하단 중앙, 아주 옅은 회색, 반투명 */
    .pagePill{
      position:absolute;
      bottom:12px;
      left:50%;
      transform:translateX(-50%);
      padding:8px 14px;
      border-radius:999px;
      background:var(--pillBg);
      color:var(--pillFg);
      border:1px solid var(--pillBd);
      font-size:12px;
      font-weight:800;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      pointer-events:none;
      white-space:nowrap;
    }

    /* 에러/로딩 */
    .msg{
      position:absolute;
      top:12px;
      left:12px;
      right:12px;
      padding:10px 12px;
      border-radius:12px;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.08);
      color:rgba(255,255,255,0.70);
      font-size:12px;
      font-weight:700;
      display:none;
    }
    .msg.show{ display:block; }
    .msg b{ color:#fff; }

    /* 모바일에서 버튼/필 표시 여백 */
    @media (max-width:520px){
      #prevBtn{ left:10px; }
      #nextBtn{ right:10px; }
      .navBtn{ bottom:10px; }
      .pagePill{ bottom:10px; padding:7px 12px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="stage" id="stage">
      <div class="msg" id="msg"></div>

      <button class="navBtn" id="prevBtn" aria-label="Previous page">
        <span class="navIcon">‹</span>
      </button>

      <div class="pagePill" id="pageInfo">Page 0 / 0</div>

      <button class="navBtn" id="nextBtn" aria-label="Next page">
        <span class="navIcon">›</span>
      </button>

      <canvas id="pdfCanvas"></canvas>
    </div>
  </div>

  <script>
    // ===== pdf.js worker (CDN) =====
    // 이 줄이 없거나 잘못되면 "0/0"이 가장 자주 발생
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.js";

    const canvas = document.getElementById("pdfCanvas");
    const ctx = canvas.getContext("2d", { alpha: true });

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const pageInfo = document.getElementById("pageInfo");
    const msg = document.getElementById("msg");
    const stage = document.getElementById("stage");

    let pdfDoc = null;
    let pageNum = 1;
    let pageCount = 0;
    let rendering = false;
    let pending = null;

    function showMsg(html){
      msg.innerHTML = html;
      msg.classList.add("show");
    }
    function hideMsg(){
      msg.classList.remove("show");
      msg.innerHTML = "";
    }

    function getFileParam(){
      const sp = new URLSearchParams(location.search);
      let f = sp.get("file") || "";
      try{ f = decodeURIComponent(f); }catch(e){}
      return f.trim();
    }

    function setButtons(){
      prevBtn.disabled = !pdfDoc || pageNum <= 1 || rendering;
      nextBtn.disabled = !pdfDoc || pageNum >= pageCount || rendering;
      pageInfo.textContent = `Page ${pdfDoc ? pageNum : 0} / ${pdfDoc ? pageCount : 0}`;
    }

    function computeBestScale(viewport){
      // stage 안에서 "최대 확대" (검은 배경 최소화)
      const pad = 20; // 버튼/필이 아래에 있으니 상하 여백 약간 확보
      const cw = stage.clientWidth;
      const ch = stage.clientHeight;

      // 아래 UI(버튼/필) 영역 고려: 하단 70px 정도 확보
      const usableW = Math.max(100, cw - pad);
      const usableH = Math.max(100, ch - (pad + 70));

      const scaleW = usableW / viewport.width;
      const scaleH = usableH / viewport.height;

      // 화면에 꽉 차게 (조금만 여유)
      return Math.min(scaleW, scaleH) * 0.995;
    }

    async function renderPage(num){
      if(!pdfDoc) return;

      rendering = true;
      setButtons();

      try{
        const page = await pdfDoc.getPage(num);

        // 1) 기본 viewport
        const base = page.getViewport({ scale: 1 });

        // 2) 최적 scale 계산
        const scale = computeBestScale(base);
        const vp = page.getViewport({ scale });

        // 3) HiDPI 대응
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.floor(vp.width * dpr);
        canvas.height = Math.floor(vp.height * dpr);
        canvas.style.width = Math.floor(vp.width) + "px";
        canvas.style.height = Math.floor(vp.height) + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, vp.width, vp.height);

        const renderTask = page.render({ canvasContext: ctx, viewport: vp });
        await renderTask.promise;

        pageNum = num;
        rendering = false;
        setButtons();

        if(pending !== null){
          const next = pending;
          pending = null;
          renderPage(next);
        }
      }catch(err){
        rendering = false;
        setButtons();
        showMsg(`<b>Render failed.</b> ${String(err && err.message ? err.message : err)}`);
      }
    }

    function queueRender(num){
      if(rendering){
        pending = num;
        return;
      }
      renderPage(num);
    }

    function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

    prevBtn.addEventListener("click", ()=>{
      if(!pdfDoc) return;
      const n = clamp(pageNum - 1, 1, pageCount);
      queueRender(n);
    });
    nextBtn.addEventListener("click", ()=>{
      if(!pdfDoc) return;
      const n = clamp(pageNum + 1, 1, pageCount);
      queueRender(n);
    });

    // 키보드(옵션)
    window.addEventListener("keydown", (e)=>{
      if(e.key === "ArrowLeft") prevBtn.click();
      if(e.key === "ArrowRight") nextBtn.click();
    });

    // 리사이즈 시 현재 페이지 다시 렌더 (Tools 펼침/접힘 대응)
    let resizeTimer = null;
    const ro = new ResizeObserver(()=>{
      if(!pdfDoc) return;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(()=>queueRender(pageNum), 120);
    });
    ro.observe(stage);

    async function boot(){
      const fileUrl = getFileParam();
      if(!fileUrl){
        showMsg(`<b>No PDF.</b> Use ?file=PDF_URL`);
        return;
      }

      showMsg(`<b>Loading…</b>`);
      setButtons();

      try{
        // PDF 로드 (URL)
        const loadingTask = pdfjsLib.getDocument({
          url: fileUrl,
          withCredentials: false,
          disableStream: false,
          disableAutoFetch: false
        });

        pdfDoc = await loadingTask.promise;
        pageCount = pdfDoc.numPages || 0;
        hideMsg();

        pageNum = 1;
        setButtons();
        await renderPage(pageNum);

      }catch(err){
        pdfDoc = null;
        pageCount = 0;
        setButtons();

        showMsg(
          `<b>PDF load failed.</b><br>` +
          `URL: ${fileUrl}<br>` +
          `${String(err && err.message ? err.message : err)}`
        );
      }
    }

    boot();
  </script>
</body>
</html>
