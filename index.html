<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EPS Flipbook Viewer</title>
  <style>
    html,body{height:100%;margin:0;background:#0b0f17;color:#e8eefc;font-family:system-ui,-apple-system,Segoe UI,Roboto,Pretendard,sans-serif;}
    .wrap{height:100%;display:flex;flex-direction:column;}
    .top{padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.08);}
    .btn{background:#1b2333;color:#e8eefc;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 10px;cursor:pointer;}
    .btn:disabled{opacity:.45;cursor:not-allowed;}
    .meta{opacity:.85;font-size:13px}
    .main{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    canvas{background:#101827;border-radius:14px;box-shadow:0 12px 28px rgba(0,0,0,.45);max-width:100%;max-height:100%;}
    .hint{padding:12px;font-size:13px;opacity:.8;border-top:1px solid rgba(255,255,255,.08);}
    input[type="text"]{flex:1;min-width:280px;background:#0f1624;border:1px solid rgba(255,255,255,.12);color:#e8eefc;border-radius:10px;padding:8px 10px;outline:none;}
  </style>

  <!-- pdf.js CDN (viewer 안정화) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body>
<div class="wrap">
  <div class="top">
    <button id="prev" class="btn">Prev</button>
    <button id="next" class="btn">Next</button>
    <span id="pageinfo" class="meta">Page - / -</span>
    <input id="fileInput" type="text" placeholder="PDF URL will appear here (from ?file=...)" />
    <button id="load" class="btn">Load</button>
  </div>

  <div class="main">
    <canvas id="c"></canvas>
  </div>

  <div class="hint">
    Usage: open <b>index.html?file=ENCODED_PDF_URL</b>. Example:
    <span style="opacity:.85">index.html?file=https%3A%2F%2F...%2Fpdf%2Feps%2Fu01%2Fph.pdf</span>
  </div>
</div>

<script>
  // pdf.worker CDN (중요: worker 미로딩이면 흰 화면/멈춤이 자주 발생)
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const $ = (id)=>document.getElementById(id);
  const canvas = $("c");
  const ctx = canvas.getContext("2d");

  let pdfDoc = null;
  let pageNum = 1;
  let pageRendering = false;
  let pageNumPending = null;
  let scale = 1.2;

  function getFileFromQuery(){
    const u = new URL(location.href);
    const f = u.searchParams.get("file");
    return f ? f : "";
  }

  async function renderPage(num){
    pageRendering = true;
    const page = await pdfDoc.getPage(num);

    // 16:9 iframe에서 잘 보이도록: canvas를 가능한 크게
    const viewport = page.getViewport({ scale });
    canvas.height = viewport.height;
    canvas.width = viewport.width;

    const renderTask = page.render({ canvasContext: ctx, viewport });
    await renderTask.promise;

    pageRendering = false;
    $("pageinfo").textContent = `Page ${pageNum} / ${pdfDoc.numPages}`;
    $("prev").disabled = (pageNum <= 1);
    $("next").disabled = (pageNum >= pdfDoc.numPages);

    if(pageNumPending !== null){
      const p = pageNumPending;
      pageNumPending = null;
      renderPage(p);
    }
  }

  function queueRenderPage(num){
    if(pageRendering){
      pageNumPending = num;
    }else{
      renderPage(num);
    }
  }

  async function loadPdf(pdfUrl){
    if(!pdfUrl){
      alert("No PDF URL. Provide ?file=... or paste a URL then click Load.");
      return;
    }
    $("fileInput").value = pdfUrl;

    try{
      const loadingTask = pdfjsLib.getDocument({
        url: pdfUrl,
        // jsDelivr/일반 서버 모두를 위해 기본값 유지.
        // 필요 시 CORS 이슈가 있는 서버에서는 withCredentials 등 조정 가능.
      });
      pdfDoc = await loadingTask.promise;
      pageNum = 1;
      $("pageinfo").textContent = `Page ${pageNum} / ${pdfDoc.numPages}`;
      queueRenderPage(pageNum);
    }catch(e){
      console.error(e);
      alert("PDF load failed. Open DevTools Console for details.\n\n" + (e?.message || e));
    }
  }

  $("prev").addEventListener("click", ()=>{
    if(!pdfDoc || pageNum <= 1) return;
    pageNum--;
    queueRenderPage(pageNum);
  });

  $("next").addEventListener("click", ()=>{
    if(!pdfDoc || pageNum >= pdfDoc.numPages) return;
    pageNum++;
    queueRenderPage(pageNum);
  });

  $("load").addEventListener("click", ()=>{
    loadPdf($("fileInput").value.trim());
  });

  // 초기 자동 로드: ?file=...
  const initial = getFileFromQuery();
  if(initial){
    loadPdf(initial);
  }
</script>
</body>
</html>
