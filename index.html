<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>EPS Flipbook Viewer</title>

  <style>
    :root{
      --bg:#0b1220; --panel:#0f172a; --text:#e5e7eb; --muted:#94a3b8;
      --border:rgba(255,255,255,.10);
    }
    html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
    *{-ms-overflow-style:none;scrollbar-width:none;box-sizing:border-box}
    *::-webkit-scrollbar{width:0;height:0}

    .wrap{height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
    .viewer{
      width:min(1280px,100%);height:min(720px,100%);
      background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02));
      border:1px solid var(--border);border-radius:16px;overflow:hidden;
      box-shadow:0 14px 40px rgba(0,0,0,.35);display:flex;flex-direction:column
    }
    .topbar{
      height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:10px 12px;background:rgba(255,255,255,.03);
      border-bottom:1px solid var(--border);color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif
    }
    .brand{font-weight:900;font-size:14px;display:flex;gap:10px;align-items:center}
    .brand small{color:var(--muted);font-weight:800;font-size:12px}
    .ctrl{display:flex;gap:10px}
    .btn{
      background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.06));
      border:1px solid var(--border);color:var(--text);
      padding:10px 14px;border-radius:999px;font-weight:900;cursor:pointer
    }
    .btn:disabled{opacity:.35;cursor:not-allowed}
    .page{
      font-weight:900;color:var(--text);background:rgba(0,0,0,.20);
      border:1px solid var(--border);padding:10px 14px;border-radius:999px
    }
    .stage{
      flex:1;background:linear-gradient(180deg,rgba(0,0,0,.20),rgba(0,0,0,.45));
      display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden
    }
    .paper{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
    canvas{
      max-width:100%;max-height:100%;border-radius:14px;background:#0a0f1c;
      box-shadow:0 16px 44px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.08)
    }
    .hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;
      color:var(--muted);font-size:12px;font-weight:800}
    .error{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
      background:rgba(0,0,0,.5)}
    .error.show{display:flex}
    .error .box{background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.12);
      border-radius:16px;padding:16px 18px;color:#e5e7eb;font-weight:800}
  </style>
</head>

<body>
<div class="wrap">
  <div class="viewer">
    <div class="topbar">
      <div class="brand">EPS Flipbook Viewer <small id="fileName"></small></div>
      <div class="ctrl">
        <button class="btn" id="prevBtn">◀ Prev</button>
        <div class="page" id="pageInd">- / -</div>
        <button class="btn" id="nextBtn">Next ▶</button>
      </div>
    </div>
    <div class="stage">
      <div class="paper"><canvas id="canvas"></canvas></div>
      <div class="hint">Page-Turn Mode · No Scroll</div>
      <div class="error" id="err"><div class="box" id="errMsg"></div></div>
    </div>
  </div>
</div>

<script type="module">
  import * as pdfjsLib from "./pdf.min.js";

  const $=id=>document.getElementById(id);
  const prev=$("prevBtn"), next=$("nextBtn"), pageInd=$("pageInd"),
        fileName=$("fileName"), canvas=$("canvas"),
        err=$("err"), errMsg=$("errMsg");

  const getParam=n=>new URL(location.href).searchParams.get(n)||"";
  const repoRoot=()=>location.origin+"/"+location.pathname.split("/").filter(Boolean)[0]+"/";
  const resolve=f=>{
    if(!f) return "";
    if(/^https?:\/\//i.test(f)) return f;
    if(f.startsWith("/")) return location.origin+f;
    return new URL(f, repoRoot()).toString();
  };

  const fileParam=getParam("file")||getParam("f");
  const pdfUrl=resolve(fileParam);
  fileName.textContent=fileParam?("· "+fileParam.split("/").pop()):"";

  try{
    pdfjsLib.GlobalWorkerOptions.workerPort =
      new Worker("./pdf.worker.min.js",{type:"module"});
  }catch(e){ console.warn(e); }

  let pdfDoc=null, pageNum=1, renderTask=null;

  const showErr=m=>{err.classList.add("show"); errMsg.textContent=m};
  const hideErr=()=>{err.classList.remove("show"); errMsg.textContent=""};

  const setBtns=()=>{
    if(!pdfDoc){prev.disabled=next.disabled=true; pageInd.textContent="- / -"; return;}
    prev.disabled=pageNum<=1; next.disabled=pageNum>=pdfDoc.numPages;
    pageInd.textContent=pageNum+" / "+pdfDoc.numPages;
  };

  async function renderPage(n){
    if(!pdfDoc) return; hideErr();
    if(renderTask?.cancel) try{renderTask.cancel()}catch{}
    const page=await pdfDoc.getPage(n);
    const base=page.getViewport({scale:1});
    const box=canvas.parentElement;
    const scale=Math.min((box.clientWidth-32)/base.width,(box.clientHeight-32)/base.height);
    const vp=page.getViewport({scale:Math.max(scale,.1)});
    const ctx=canvas.getContext("2d",{alpha:false});
    canvas.width=vp.width|0; canvas.height=vp.height|0;
    renderTask=page.render({canvasContext:ctx, viewport:vp});
    await renderTask.promise; setBtns();
  }

  async function load(){
    if(!pdfUrl) return showErr("Missing ?file=...");
    try{
      pdfDoc=await pdfjsLib.getDocument({url:pdfUrl}).promise;
      pageNum=1; setBtns(); await renderPage(pageNum);
    }catch(e){ showErr(String(e)); }
  }

  prev.onclick=async()=>{ if(pageNum>1){pageNum--; await renderPage(pageNum)} };
  next.onclick=async()=>{ if(pdfDoc && pageNum<pdfDoc.numPages){pageNum++; await renderPage(pageNum)} };
  window.onresize=()=>pdfDoc && renderPage(pageNum);

  setBtns(); load();
</script>
</body>
</html>
