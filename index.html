<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EPS Flipbook Viewer</title>
  <style>
    html,body{height:100%;margin:0;background:#0b1220;font-family:system-ui,-apple-system,Segoe UI,Roboto,Pretendard,sans-serif;}
    .wrap{height:100%;display:flex;flex-direction:column;}
    .topbar{
      height:84px;flex:0 0 auto;
      display:flex;align-items:center;justify-content:space-between;
      padding:0 18px;color:#e2e8f0;
      background:linear-gradient(180deg, rgba(15,23,42,.92), rgba(11,18,32,.92));
      border-bottom:1px solid rgba(148,163,184,.18);
      box-sizing:border-box;
    }
    .brand{font-weight:900;letter-spacing:.2px;}
    .usage{font-size:13px;color:#94a3b8;font-weight:800;}
    .usage code{color:#e2e8f0;background:rgba(255,255,255,.06);padding:2px 6px;border-radius:8px;}
    .stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;}
    .frame{
      width:min(1200px,96vw);
      height:min(680px, calc(100vh - 110px));
      background:#0f172a;
      border-radius:18px;
      box-shadow:0 18px 40px rgba(0,0,0,.35);
      overflow:hidden;
      border:1px solid rgba(148,163,184,.16);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#94a3b8;
      position:relative;
    }
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0f172a;}
    .hint{position:absolute;left:18px;bottom:14px;font-size:12px;font-weight:800;color:#94a3b8;}
    .err{padding:18px;max-width:900px;line-height:1.5}
    .err b{color:#e2e8f0}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">EPS Flipbook Viewer</div>
      <div class="usage">
        Usage:
        <code>index.html?file=pdf/eps/u01/ph.pdf</code>
        or
        <code>index.html?file=https://.../pdf/eps/u01/ph.pdf</code>
      </div>
    </div>

    <div class="stage">
      <div class="frame" id="frame">
        <div class="hint">Page-Turn Mode · No Scroll</div>
      </div>
    </div>
  </div>

  <script>
    /**
     * ============================================================
     * 핵심: file 파라미터 절대URL/상대경로 모두 안전 처리
     * - 절대URL이면 그대로 사용
     * - 상대경로면 "repo 루트(…/eps-topik-flipbook/)"를 정확히 1번만 붙임
     * - 이미 eps-topik-flipbook/ 로 시작하면 중복 붙임 방지
     * ============================================================
     */

    function getRepoRoot() {
      // GitHub Pages 프로젝트 사이트 기준:
      // location.pathname: /eps-topik-flipbook/index.html
      // repoRoot: https://<user>.github.io/eps-topik-flipbook/
      const url = new URL(window.location.href);
      const path = url.pathname;

      // index.html이 루트에 있다는 전제 하에, /index.html 제거 후 trailing slash 보장
      const rootPath = path.replace(/\/index\.html.*$/i, "/");
      return url.origin + rootPath; // e.g. https://jbmoon...github.io/eps-topik-flipbook/
    }

    function isAbsoluteHttpUrl(s) {
      return /^https?:\/\//i.test(s);
    }

    function normalizeFileParam(raw) {
      if (!raw) return null;

      let f = raw.trim();

      // 차단: 위험 스킴
      if (/^(javascript:|data:|file:)/i.test(f)) return null;

      // 이미 절대 URL이면 그대로
      if (isAbsoluteHttpUrl(f)) return f;

      // protocol-relative (//example.com/...)도 차단/정규화하지 않음
      if (/^\/\//.test(f)) return null;

      const repoRoot = getRepoRoot(); // .../eps-topik-flipbook/
      const origin = window.location.origin;

      // 절대 경로(/pdf/...)면 origin 붙임
      if (f.startsWith("/")) {
        return origin + f;
      }

      // 중복 방지:
      // - "eps-topik-flipbook/..." 로 시작하면 repoRoot 뒤에 또 붙지 않게 제거
      // - 또는 "./" 제거
      f = f.replace(/^\.\//, "");

      const repoFolder = repoRoot.replace(origin + "/", ""); // eps-topik-flipbook/
      if (f.startsWith(repoFolder)) {
        f = f.slice(repoFolder.length); // pdf/eps/u01/ph.pdf 로 만듦
      }

      return repoRoot + f; // repoRoot + pdf/eps/u01/ph.pdf
    }

    function boot() {
      const params = new URLSearchParams(window.location.search);
      const raw = params.get("file");
      const pdfAbs = normalizeFileParam(raw);

      const frame = document.getElementById("frame");

      if (!pdfAbs) {
        frame.innerHTML = `
          <div class="err">
            <b>Missing or invalid "file" parameter.</b><br/><br/>
            Example 1 (relative): <code>index.html?file=pdf/eps/u01/ph.pdf</code><br/>
            Example 2 (absolute): <code>index.html?file=https://.../pdf/eps/u01/ph.pdf</code><br/><br/>
            Current repoRoot: <code>${getRepoRoot()}</code>
          </div>
        `;
        return;
      }

      // 여기서부터는 당신의 “페이지 넘김 뷰어” 엔진을 호출하면 됨.
      // 기존 구현이 iframe/pdf.js/flipbook 라이브러리 어떤 형태든 상관없음.
      // 가장 안전한 방식: 기존 flipbook 페이지(예: viewer.html)에 pdfAbs를 넘기기.
      //
      // 만약 당신이 이미 index.html 내부에서 flipbook을 직접 렌더링 중이라면,
      // "pdfAbs"를 기존 로더에 그대로 전달하면 된다.

      // [A] 당신이 별도 viewer.html을 쓰는 경우(권장)
      //    viewer.html?pdf=<ABS_URL> 패턴으로 유지
      //
      // [B] index.html이 직접 렌더링하는 경우
      //    initFlipbook(pdfAbs) 처럼 연결하면 된다.

      // 여기서는 “최소 변경”을 위해, index.html이 viewer 역할을 한다고 가정하고
      // 별도 viewer.html이 없다면, 아래 iframe 방식을 그대로 사용해도 됩니다.
      //
      // 단, 당신이 기존에 flipbook 엔진을 index.html에 이미 붙여놨다면
      // 아래 iframe 부분을 지우고, 기존 init 로더에 pdfAbs만 꽂으세요.

      const ifr = document.createElement("iframe");
      ifr.loading = "lazy";

      // ✅ 가장 단순: 브라우저 PDF 뷰어로 열기(원하면 기존 flipbook 엔진으로 교체)
      // ifr.src = pdfAbs;

      // ✅ 권장: 당신이 운영하는 flipbook 엔진이 index.html 내부라면,
      // 아래처럼 "pdfAbs"를 file=로 다시 주지 말고 그대로 로더에 사용해야 한다.
      // (현재 단계에선 "pdfAbs를 만들기"가 목적이라 iframe은 임시 표시 역할)
      ifr.src = pdfAbs;

      frame.innerHTML = "";
      frame.appendChild(ifr);
      const hint = document.createElement("div");
      hint.className = "hint";
      hint.textContent = "Page-Turn Mode · No Scroll";
      frame.appendChild(hint);

      // 디버그(필요시)
      // console.log("[Viewer] repoRoot:", getRepoRoot());
      // console.log("[Viewer] raw:", raw);
      // console.log("[Viewer] pdfAbs:", pdfAbs);
    }

    boot();
  </script>
</body>
</html>
