<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flipbook Viewer</title>

  <style>
    html,body{
      height:100%;
      margin:0;
      background:#0b0f17;
      color:#e8eefc;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Pretendard,sans-serif;
    }

    /* ✅ WordPress iframe 16:9에 맞게 "완전 꽉 차게" */
    .wrap{height:100%;width:100%;display:flex;flex-direction:column;overflow:hidden;}
    .stage{
      flex:1;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      background:#0b0f17;
    }

    /* ✅ 슬라이드: 최대한 크게, 여백 최소 */
    canvas{
      display:block;
      max-width:100%;
      max-height:100%;
      border-radius:18px;
      background:#ffffff;
      box-shadow:0 10px 26px rgba(0,0,0,.45);
    }

    /* ✅ 좌/우 탭존 (슬라이드 안에서 넘김) */
    .tapZone{
      position:absolute; top:0; bottom:0;
      width:22%;
      cursor:pointer;
      user-select:none;
      z-index:4;
    }
    .tapLeft{left:0;}
    .tapRight{right:0;}

    /* =========================
       TOP OVERLAY BAR (UNIFIED)
       - EPS/TOPIK2 동일
       - Prev/Next는 중간 회색
       - 버튼/텍스트는 검정색 계열(흰 슬라이드에서 잘 보이게)
       ========================= */
    .topBar{
      position:absolute;
      top:10px;
      left:50%;
      transform:translateX(-50%);
      display:flex;
      align-items:center;
      gap:10px;
      padding:8px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.72);
      border:1px solid rgba(0,0,0,.10);
      backdrop-filter: blur(8px);
      z-index:9;
      user-select:none;
    }

    .topBtn{
      height:30px;
      padding:0 10px;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      cursor:pointer;
      border:1px solid rgba(0,0,0,.12);
      background:rgba(255,255,255,.60);
      color:#6b7280;            /* ✅ Prev/Next 중간 회색 */
      font-weight:900;
      font-size:12px;
      transition: transform .12s ease, background .12s ease, opacity .12s ease;
      white-space:nowrap;
    }
    .topBtn:hover{ background:rgba(255,255,255,.78); }
    .topBtn:active{ transform:scale(.98); }
    .topBtn.disabled{ opacity:.35; cursor:not-allowed; }

    .pageText{
      min-width:110px;
      text-align:center;
      font-size:12px;
      font-weight:1000;
      color:#111827;            /* ✅ Page는 진하게 */
      opacity:.95;
      padding:0 6px;
    }

    /* =========================
       CORNER BUTTONS (UNIFIED)
       - 44 -> 36 (요청 반영)
       - 내부 기호는 검정
       - 배경은 밝은 반투명(검정 배경에서도 바로 보이게)
       ========================= */
    .cornerNav{
      position:absolute;
      top:10px;
      left:10px;
      right:10px;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      z-index:10;
      pointer-events:none;
    }

    .cornerBtn{
      pointer-events:auto;
      width:36px; height:36px;          /* ✅ 44 -> 36 */
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.70);  /* ✅ 밝게 */
      border:1px solid rgba(0,0,0,.12);
      backdrop-filter: blur(8px);
      color:#111827;                    /* ✅ 기호(아이콘) 검정 */
      font-size:20px;
      font-weight:1000;
      opacity:.95;
      cursor:pointer;
      user-select:none;
      box-shadow:0 10px 22px rgba(0,0,0,.25);
      transition: transform .12s ease, opacity .12s ease, background .12s ease;
    }
    .cornerBtn:hover{ background:rgba(255,255,255,.85); }
    .cornerBtn:active{ transform:scale(.96); }
    .cornerBtn.disabled{ opacity:.25; cursor:not-allowed; box-shadow:none; }

    /* 로딩/에러 */
    .msg{
      position:absolute; inset:0;
      display:flex;align-items:center;justify-content:center;
      font-size:13px;opacity:.85;text-align:center;padding:16px;
      z-index:2;
    }
  </style>

  <!-- pdf.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body>
<div class="wrap">
  <div class="stage" id="stage">

    <!-- ✅ Unified Top Bar -->
    <div class="topBar" aria-label="Page controls">
      <div class="topBtn" id="btnPrev" aria-label="Previous page">◀ Prev</div>
      <div class="pageText" id="pageText">Page - / -</div>
      <div class="topBtn" id="btnNext" aria-label="Next page">Next ▶</div>
    </div>

    <!-- ✅ Unified Corner Buttons -->
    <div class="cornerNav" aria-label="Corner navigation">
      <div class="cornerBtn" id="cPrev" aria-label="Previous page">‹</div>
      <div class="cornerBtn" id="cNext" aria-label="Next page">›</div>
    </div>

    <!-- ✅ big tap zones -->
    <div class="tapZone tapLeft" id="tapLeft" aria-label="Previous page"></div>
    <canvas id="c"></canvas>
    <div class="tapZone tapRight" id="tapRight" aria-label="Next page"></div>

    <div class="msg" id="msg">Loading…</div>
  </div>
</div>

<script>
  // worker CDN
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const $ = (id)=>document.getElementById(id);
  const canvas = $("c");
  const ctx = canvas.getContext("2d", { alpha: false });
  const stage = $("stage");
  const msg = $("msg");

  // UI elements
  const btnPrev = $("btnPrev");
  const btnNext = $("btnNext");
  const pageText = $("pageText");
  const cPrev = $("cPrev");
  const cNext = $("cNext");

  let pdfDoc = null;
  let pageNum = 1;
  let rendering = false;
  let pending = null;
  let lastPageViewport1 = null;

  function getFileFromQuery(){
    const u = new URL(location.href);
    return u.searchParams.get("file") || "";
  }

  function setMsg(t){
    msg.style.display = t ? "flex" : "none";
    msg.textContent = t || "";
  }

  function setControls(){
    if(!pdfDoc){
      pageText.textContent = "Page - / -";
      btnPrev.classList.add("disabled");
      btnNext.classList.add("disabled");
      cPrev.classList.add("disabled");
      cNext.classList.add("disabled");
      return;
    }

    pageText.textContent = `Page ${pageNum} / ${pdfDoc.numPages}`;

    const atFirst = pageNum <= 1;
    const atLast  = pageNum >= pdfDoc.numPages;

    btnPrev.classList.toggle("disabled", atFirst);
    btnNext.classList.toggle("disabled", atLast);
    cPrev.classList.toggle("disabled", atFirst);
    cNext.classList.toggle("disabled", atLast);
  }

  /* =========================
     ✅ 핵심: 슬라이드 최대 확대
     - padding/예약영역 최소화
     - 검은 배경 여백 거의 제거
     ========================= */
  function calcScaleToFit(viewport1){
    const padding = 4;      // ✅ 여백 최소
    const reservedTop = 54; // ✅ 상단 버튼 영역만 확보(최소)
    const reservedBottom = 6;

    const maxW = Math.max(200, stage.clientWidth - padding);
    const maxH = Math.max(200, stage.clientHeight - padding - reservedTop - reservedBottom);

    const s = Math.min(maxW / viewport1.width, maxH / viewport1.height);
    return Math.max(0.1, s);
  }

  async function renderPage(num){
    rendering = true;
    setMsg("Loading…");

    const page = await pdfDoc.getPage(num);
    lastPageViewport1 = page.getViewport({ scale: 1 });

    const scale = calcScaleToFit(lastPageViewport1);
    const viewport = page.getViewport({ scale });

    const dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width  = Math.floor(viewport.width  * dpr);
    canvas.height = Math.floor(viewport.height * dpr);
    canvas.style.width  = Math.floor(viewport.width) + "px";
    canvas.style.height = Math.floor(viewport.height) + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    try{
      await page.render({ canvasContext: ctx, viewport }).promise;
      setMsg("");
    }catch(e){
      console.error(e);
      setMsg("Render failed. Check console.");
    }

    setControls();
    rendering = false;

    if(pending !== null){
      const p = pending;
      pending = null;
      renderPage(p);
    }
  }

  function queueRender(num){
    if(rendering) pending = num;
    else renderPage(num);
  }

  function prev(){
    if(!pdfDoc || pageNum <= 1) return;
    pageNum--;
    queueRender(pageNum);
  }

  function next(){
    if(!pdfDoc || pageNum >= pdfDoc.numPages) return;
    pageNum++;
    queueRender(pageNum);
  }

  // Click bindings
  btnPrev.addEventListener("click", ()=>{ if(!btnPrev.classList.contains("disabled")) prev(); });
  btnNext.addEventListener("click", ()=>{ if(!btnNext.classList.contains("disabled")) next(); });

  cPrev.addEventListener("click", ()=>{ if(!cPrev.classList.contains("disabled")) prev(); });
  cNext.addEventListener("click", ()=>{ if(!cNext.classList.contains("disabled")) next(); });

  $("tapLeft").addEventListener("click", prev);
  $("tapRight").addEventListener("click", next);

  // Keyboard
  window.addEventListener("keydown", (e)=>{
    if(e.key === "ArrowLeft") prev();
    if(e.key === "ArrowRight") next();
  });

  // Resize 대응
  const ro = new ResizeObserver(()=>{
    if(pdfDoc && lastPageViewport1){
      queueRender(pageNum);
    }
  });
  ro.observe(stage);

  async function loadPdf(url){
    if(!url){
      setMsg("No PDF URL.\nOpen with ?file=ENCODED_PDF_URL");
      setControls();
      return;
    }

    setMsg("Loading…");
    try{
      const task = pdfjsLib.getDocument({ url });
      pdfDoc = await task.promise;
      pageNum = 1;
      setControls();
      queueRender(pageNum);
    }catch(e){
      console.error(e);
      setMsg("PDF load failed. Check console.");
      setControls();
    }
  }

  // init
  loadPdf(getFileFromQuery());
</script>
</body>
</html>
