<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EPS Flipbook Viewer</title>

  <style>
    html,body{height:100%;margin:0;background:#0b0f17;color:#e8eefc;font-family:system-ui,-apple-system,Segoe UI,Roboto,Pretendard,sans-serif;}
    /* ✅ WordPress iframe 16:9에 맞게 "완전 꽉 차게" */
    .wrap{height:100%;width:100%;display:flex;flex-direction:column;overflow:hidden;}
    .stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0b0f17;}
    canvas{display:block;max-width:100%;max-height:100%;border-radius:14px;background:#0f1624;box-shadow:0 14px 34px rgba(0,0,0,.55);}

    /* ✅ 좌/우 터치 영역 (슬라이드 안에서 넘김) */
    .tapZone{
      position:absolute;top:0;bottom:0;width:22%;
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;user-select:none;
      z-index:5;
    }
    .tapLeft{left:0;}
    .tapRight{right:0;}

    /* ✅ < > 오버레이 버튼 */
    .arrow{
      width:56px;height:56px;border-radius:999px;
      display:flex;align-items:center;justify-content:center;
      background:rgba(15,22,36,.55);
      border:1px solid rgba(255,255,255,.15);
      backdrop-filter: blur(6px);
      font-size:28px;font-weight:900;
      color:#e8eefc;
      opacity:.92;
      transition: transform .12s ease, opacity .12s ease;
    }
    .tapZone:active .arrow{transform:scale(.96);opacity:1;}

    /* 중앙 페이지 표시 (작게) */
    .pageBadge{
      position:absolute;top:10px;left:50%;transform:translateX(-50%);
      padding:6px 10px;border-radius:999px;
      background:rgba(15,22,36,.55);
      border:1px solid rgba(255,255,255,.12);
      font-size:12px;font-weight:800;
      z-index:6;
      user-select:none;
    }

    /* 로딩/에러 */
    .msg{
      position:absolute;inset:0;
      display:flex;align-items:center;justify-content:center;
      font-size:13px;opacity:.85;text-align:center;padding:16px;
      z-index:2;
    }
  </style>

  <!-- pdf.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body>
<div class="wrap">
  <div class="stage" id="stage">
    <div class="pageBadge" id="pageBadge">Page - / -</div>

    <div class="tapZone tapLeft" id="tapLeft" aria-label="Previous page">
      <div class="arrow">&lt;</div>
    </div>

    <canvas id="c"></canvas>

    <div class="tapZone tapRight" id="tapRight" aria-label="Next page">
      <div class="arrow">&gt;</div>
    </div>

    <div class="msg" id="msg">Loading…</div>
  </div>
</div>

<script>
  // ✅ worker CDN
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const $ = (id)=>document.getElementById(id);
  const canvas = $("c");
  const ctx = canvas.getContext("2d", { alpha: false });
  const stage = $("stage");
  const msg = $("msg");
  const badge = $("pageBadge");

  let pdfDoc = null;
  let pageNum = 1;
  let rendering = false;
  let pending = null;
  let lastPageViewport1 = null; // scale=1 기준 viewport 저장

  function getFileFromQuery(){
    const u = new URL(location.href);
    return u.searchParams.get("file") || "";
  }

  function setMsg(t){
    msg.style.display = t ? "flex" : "none";
    msg.textContent = t || "";
  }

  function setBadge(){
    if(!pdfDoc){
      badge.textContent = "Page - / -";
      return;
    }
    badge.textContent = `Page ${pageNum} / ${pdfDoc.numPages}`;
  }

  // ✅ stage 크기에 맞게 scale 계산 (Summary급으로 꽉 차게 보이게)
  function calcScaleToFit(viewport1){
    const padding = 18; // 테두리/여백 최소치
    const maxW = Math.max(200, stage.clientWidth - padding);
    const maxH = Math.max(200, stage.clientHeight - padding);
    const s = Math.min(maxW / viewport1.width, maxH / viewport1.height);
    return Math.max(0.1, s);
  }

  async function renderPage(num){
    rendering = true;
    setMsg("Loading…");

    const page = await pdfDoc.getPage(num);

    // scale=1 viewport
    lastPageViewport1 = page.getViewport({ scale: 1 });

    const scale = calcScaleToFit(lastPageViewport1);
    const viewport = page.getViewport({ scale });

    // ✅ 고해상도 렌더링 (Retina)
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width  = Math.floor(viewport.width  * dpr);
    canvas.height = Math.floor(viewport.height * dpr);
    canvas.style.width  = Math.floor(viewport.width) + "px";
    canvas.style.height = Math.floor(viewport.height) + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    try{
      await page.render({ canvasContext: ctx, viewport }).promise;
      setMsg("");
    }catch(e){
      console.error(e);
      setMsg("Render failed. Check console.");
    }

    setBadge();
    rendering = false;

    if(pending !== null){
      const p = pending;
      pending = null;
      renderPage(p);
    }
  }

  function queueRender(num){
    if(rendering) pending = num;
    else renderPage(num);
  }

  function prev(){
    if(!pdfDoc || pageNum <= 1) return;
    pageNum--;
    queueRender(pageNum);
  }

  function next(){
    if(!pdfDoc || pageNum >= pdfDoc.numPages) return;
    pageNum++;
    queueRender(pageNum);
  }

  // ✅ 좌/우 터치/클릭으로 페이지 넘김
  $("tapLeft").addEventListener("click", prev);
  $("tapRight").addEventListener("click", next);

  // ✅ 키보드도 지원 (PC 운영 편의)
  window.addEventListener("keydown", (e)=>{
    if(e.key === "ArrowLeft") prev();
    if(e.key === "ArrowRight") next();
  });

  // ✅ 리사이즈 시 현재 페이지 다시 렌더링 (iframe 크기 변화 대응)
  const ro = new ResizeObserver(()=>{
    if(pdfDoc && lastPageViewport1){
      queueRender(pageNum);
    }
  });
  ro.observe(stage);

  async function loadPdf(url){
    if(!url){
      setMsg("No PDF URL.\nOpen with ?file=ENCODED_PDF_URL");
      return;
    }

    setMsg("Loading…");
    try{
      const task = pdfjsLib.getDocument({ url });
      pdfDoc = await task.promise;
      pageNum = 1;
      setBadge();
      queueRender(pageNum);
    }catch(e){
      console.error(e);
      setMsg("PDF load failed. Check console.");
    }
  }

  // init
  const initial = getFileFromQuery();
  loadPdf(initial);
</script>
</body>
</html>
