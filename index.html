<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EPS Flipbook Viewer</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #071022;
      overflow: hidden; /* ✅ No scroll */
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Pretendard,sans-serif;
    }

    .wrap{
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      box-sizing: border-box;
    }

    /* ✅ 16:9 viewer (fills iframe nicely) */
    .viewer{
      width: min(1200px, 100%);
      aspect-ratio: 16 / 9;
      background: radial-gradient(1200px 600px at 50% 35%, rgba(255,255,255,.08), rgba(0,0,0,0) 60%),
                  linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,0));
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(0,0,0,.55);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 12px 14px;
      background: rgba(0,0,0,.35);
      border-bottom: 1px solid rgba(255,255,255,.10);
      gap: 12px;
    }

    .title{
      color:#e5e7eb;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: .2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 55%;
    }

    .controls{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap: nowrap;
    }

    .btn{
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.08);
      color: #e5e7eb;
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 900;
      cursor: pointer;
      user-select: none;
      line-height: 1;
    }
    .btn:disabled{
      opacity: .35;
      cursor:not-allowed;
    }

    .page-ind{
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.25);
      color: #e5e7eb;
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 900;
      min-width: 84px;
      text-align: center;
    }

    .stage{
      position: relative;
      flex: 1;
      background: #000;
    }

    canvas{
      position:absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%);
      background: #0b1220;
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(0,0,0,.55);
      max-width: calc(100% - 28px);
      max-height: calc(100% - 28px);
    }

    .hint{
      text-align:center;
      color: rgba(226,232,240,.65);
      font-size: 12px;
      font-weight: 800;
      padding: 10px 0 14px;
      background: rgba(0,0,0,.20);
      border-top: 1px solid rgba(255,255,255,.10);
    }

    .toast{
      position:absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%);
      background: rgba(15,23,42,.85);
      color: #e5e7eb;
      border: 1px solid rgba(255,255,255,.12);
      padding: 14px 16px;
      border-radius: 14px;
      font-weight: 900;
      text-align:center;
      max-width: 78%;
      box-shadow: 0 10px 26px rgba(0,0,0,.45);
      display:none;
    }
    .toast.show{ display:block; }

    @media (max-width: 768px){
      .wrap{ padding: 10px; }
      .title{ max-width: 46%; }
      .btn, .page-ind{ padding: 8px 10px; font-size: 13px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="viewer">
      <div class="topbar">
        <div class="title" id="docTitle">EPS Flipbook Viewer</div>

        <div class="controls">
          <button class="btn" id="prevBtn">◀ Prev</button>
          <div class="page-ind" id="pageInd">- / -</div>
          <button class="btn" id="nextBtn">Next ▶</button>
        </div>
      </div>

      <div class="stage" id="stage">
        <canvas id="pdfCanvas"></canvas>
        <div class="toast" id="toast"></div>
      </div>

      <div class="hint">Page-Turn Mode · No Scroll</div>
    </div>
  </div>

  <!-- ✅ MUST be next to index.html -->
  <script src="./pdf.min.js"></script>

  <script>
    // ----------------------------
    // EPS Flipbook Viewer (Stable)
    // ----------------------------

    function qs(name){
      return new URLSearchParams(location.search).get(name);
    }

    const fileParam = qs("file");
    const fitMode = (qs("fit") || "contain").toLowerCase(); // contain | cover
    const toast = document.getElementById("toast");

    function showToast(msg){
      toast.textContent = msg;
      toast.classList.add("show");
    }
    function hideToast(){
      toast.classList.remove("show");
    }

    // ✅ Hard fail message if pdfjs missing
    if (typeof window.pdfjsLib === "undefined"){
      showToast("PDF Load Failed.\n\npdfjsLib is not found.\nPut pdf.min.js next to index.html.");
      throw new Error("pdfjsLib not found");
    }

    // ✅ Worker must be next to index.html too
    pdfjsLib.GlobalWorkerOptions.workerSrc = "./pdf.worker.min.js";

    const canvas = document.getElementById("pdfCanvas");
    const ctx = canvas.getContext("2d", { alpha:false });

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const pageInd = document.getElementById("pageInd");
    const docTitle = document.getElementById("docTitle");

    let pdfDoc = null;
    let pageNum = 1;
    let rendering = false;
    let pendingNum = null;

    // Resolve file: allow absolute URL OR relative path under this repo
    function resolveFileUrl(file){
      // absolute
      if (/^https?:\/\//i.test(file)) return file;
      // relative to repo root (same origin)
      return new URL(file.replace(/^\/+/, ""), location.href).toString();
    }

    function updateUi(){
      pageInd.textContent = `${pageNum} / ${pdfDoc ? pdfDoc.numPages : "-"}`;
      prevBtn.disabled = !pdfDoc || pageNum <= 1;
      nextBtn.disabled = !pdfDoc || pageNum >= pdfDoc.numPages;
    }

    function computeScale(viewport, stageW, stageH){
      const sx = stageW / viewport.width;
      const sy = stageH / viewport.height;

      if (fitMode === "cover"){
        return Math.max(sx, sy); // fills stage, may crop
      }
      return Math.min(sx, sy);   // fits all content, may letterbox
    }

    async function renderPage(num){
      if (!pdfDoc) return;
      rendering = true;
      hideToast();

      const page = await pdfDoc.getPage(num);

      const stage = document.getElementById("stage");
      const stageW = stage.clientWidth - 28;
      const stageH = stage.clientHeight - 28;

      // first viewport at scale 1
      const vp1 = page.getViewport({ scale: 1 });

      // compute scale to fit stage
      const scale = computeScale(vp1, stageW, stageH);

      const viewport = page.getViewport({ scale });

      canvas.width  = Math.floor(viewport.width);
      canvas.height = Math.floor(viewport.height);

      const renderContext = { canvasContext: ctx, viewport };
      await page.render(renderContext).promise;

      rendering = false;

      if (pendingNum !== null){
        const next = pendingNum;
        pendingNum = null;
        renderPage(next);
      }

      updateUi();
    }

    function queueRender(num){
      if (rendering){
        pendingNum = num;
        return;
      }
      renderPage(num);
    }

    prevBtn.addEventListener("click", ()=>{
      if (!pdfDoc || pageNum <= 1) return;
      pageNum--;
      queueRender(pageNum);
    });

    nextBtn.addEventListener("click", ()=>{
      if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRender(pageNum);
    });

    // Keyboard (optional)
    window.addEventListener("keydown", (e)=>{
      if (e.key === "ArrowLeft") prevBtn.click();
      if (e.key === "ArrowRight") nextBtn.click();
    });

    // Re-render on resize (keeps 16:9 fill correct)
    let resizeTimer = null;
    window.addEventListener("resize", ()=>{
      if (!pdfDoc) return;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(()=>queueRender(pageNum), 120);
    });

    async function boot(){
      if (!fileParam){
        showToast("PDF File Path Missing\n\nUse: index.html?file=pdf/eps/u01/id.pdf");
        return;
      }

      const fileUrl = resolveFileUrl(fileParam);
      docTitle.textContent = "EPS Flipbook Viewer · " + (fileParam.split("/").pop() || "pdf");

      try{
        pdfDoc = await pdfjsLib.getDocument({ url: fileUrl }).promise;
        pageNum = 1;
        updateUi();
        renderPage(pageNum);
      }catch(err){
        console.error(err);
        showToast("PDF Load Failed.\n\nCheck:\n1) file path\n2) GitHub Pages URL\n3) .nojekyll\n4) PDF exists");
      }
    }

    boot();
  </script>
</body>
</html>
