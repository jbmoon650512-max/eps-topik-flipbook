<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EPS/TOPIK II Slide Viewer</title>

  <!-- pdf.js (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.js"></script>

  <style>
    :root{
      --bg:#0b1220;
      --frame:#000;
      --btnSize:36px;
    }
    html,body{height:100%; margin:0; background:var(--bg); font-family:system-ui,-apple-system,Segoe UI,Roboto,Pretendard,sans-serif;}
    /* 16:9 wrapper를 iframe 쪽에서 주고, viewer는 100%를 꽉 채운다고 가정 */
    .wrap{
      height:100%;
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--bg);
      overflow:hidden;
    }

    /* 검은 배경은 "프레임 역할"만 */
    .stage{
      position:relative;
      width:100%;
      height:100%;
      background:var(--frame);
      overflow:hidden;
      border-radius:14px;
      box-shadow:0 10px 28px rgba(0,0,0,.35);
    }

    /* 캔버스는 최대 확대 (contain이 아니라 "최대한 키우되 잘리지 않게") */
    .canvasBox{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--frame);
    }
    canvas{
      max-width:100%;
      max-height:100%;
      width:auto;
      height:auto;
      display:block;
      background:transparent;
    }

    /* 버튼: 하단 좌/우, 원형 유지, 텍스트 없음 */
    .navBtn{
      position:absolute;
      bottom:12px;
      width:var(--btnSize);
      height:var(--btnSize);
      border-radius:999px;
      border:none;
      background:rgba(255,255,255,0.85);
      box-shadow:0 10px 24px rgba(0,0,0,.28);
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
      z-index:30;
    }
    .navBtn:active{ transform:translateY(1px); }
    .navBtn[disabled]{ opacity:.35; cursor:not-allowed; }

    .prev{ left:12px; }
    .next{ right:12px; }

    /* 기호(< >): 진한 회색/검정 */
    .chev{
      font-size:18px;
      font-weight:900;
      color:#111;
      line-height:1;
      transform:translateY(-1px);
    }

    /* Page x / y : 하단 중앙, 아주 옅은 회색, 반투명 */
    .pageInd{
      position:absolute;
      bottom:12px;
      left:50%;
      transform:translateX(-50%);
      padding:8px 12px;
      border-radius:999px;
      background:rgba(255,255,255,0.20);
      color:rgba(255,255,255,0.65);
      font-weight:800;
      font-size:12px;
      letter-spacing:.02em;
      backdrop-filter: blur(6px);
      z-index:25;
      pointer-events:none;
    }

    /* 로딩/에러 */
    .msg{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      color:rgba(255,255,255,0.75);
      font-weight:800;
      z-index:10;
      padding:24px;
      text-align:center;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="stage" id="stage">
      <div class="canvasBox"><canvas id="pdfCanvas"></canvas></div>

      <button class="navBtn prev" id="btnPrev" aria-label="Prev">
        <span class="chev">‹</span>
      </button>
      <div class="pageInd" id="pageInd">Page 0 / 0</div>
      <button class="navBtn next" id="btnNext" aria-label="Next">
        <span class="chev">›</span>
      </button>

      <div class="msg" id="msg" style="display:none;"></div>
    </div>
  </div>

<script>
(() => {
  // -------------------------
  // 0) file= 파라미터
  // -------------------------
  const qs = new URLSearchParams(location.search);
  const fileUrl = qs.get("file");
  const msgEl = document.getElementById("msg");
  const canvas = document.getElementById("pdfCanvas");
  const ctx = canvas.getContext("2d", { alpha: true });

  const btnPrev = document.getElementById("btnPrev");
  const btnNext = document.getElementById("btnNext");
  const pageInd = document.getElementById("pageInd");
  const stage = document.getElementById("stage");

  function showMsg(t){
    msgEl.style.display = "flex";
    msgEl.textContent = t;
  }
  function hideMsg(){
    msgEl.style.display = "none";
    msgEl.textContent = "";
  }

  if(!fileUrl){
    showMsg("No PDF file specified. Use ?file=PDF_URL");
    btnPrev.disabled = true;
    btnNext.disabled = true;
    pageInd.textContent = "Page 0 / 0";
    return;
  }

  // -------------------------
  // 1) pdf.js worker (CDN)
  // -------------------------
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.js";

  // -------------------------
  // 2) 상태
  // -------------------------
  let pdfDoc = null;
  let pageNum = 1;
  let pageCount = 0;
  let rendering = false;
  let pendingRender = false;
  let lastStageW = 0, lastStageH = 0;

  function updateUI(){
    pageInd.textContent = `Page ${pageNum} / ${pageCount || 0}`;
    btnPrev.disabled = (!pdfDoc || pageNum <= 1);
    btnNext.disabled = (!pdfDoc || pageNum >= pageCount);
  }

  // -------------------------
  // 3) “최대 확대” 스케일 계산 (EPS 100점 핵심)
  // - stage 내부에서 페이지가 최대 크기로 보이되 잘리지 않게
  // -------------------------
  function computeScale(page){
    const viewport1 = page.getViewport({ scale: 1 });
    const w = stage.clientWidth;
    const h = stage.clientHeight;

    // 안전장치: 0이면 리턴
    if(w < 10 || h < 10) return 1;

    const scaleX = w / viewport1.width;
    const scaleY = h / viewport1.height;

    // "contain" 기반이되, 프레임 역할만 남기고 최대한 키움
    return Math.min(scaleX, scaleY) * 0.985; // 살짝 여유 (검은 프레임 최소)
  }

  async function renderPage(){
    if(!pdfDoc) return;

    // 렌더 중이면 한 번만 예약
    if(rendering){
      pendingRender = true;
      return;
    }
    rendering = true;
    pendingRender = false;

    try{
      hideMsg();
      const page = await pdfDoc.getPage(pageNum);
      const scale = computeScale(page);
      const viewport = page.getViewport({ scale });

      // canvas 고해상도 (레티나 대응)
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width  = Math.floor(viewport.width * dpr);
      canvas.height = Math.floor(viewport.height * dpr);
      canvas.style.width  = Math.floor(viewport.width) + "px";
      canvas.style.height = Math.floor(viewport.height) + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, viewport.width, viewport.height);

      await page.render({ canvasContext: ctx, viewport }).promise;

      updateUI();
    } catch(e){
      showMsg("Slide load failed. Check PDF URL or CORS/CDN.");
      console.error(e);
      btnPrev.disabled = true;
      btnNext.disabled = true;
      pageInd.textContent = "Page 0 / 0";
    } finally{
      rendering = false;
      if(pendingRender) renderPage();
    }
  }

  function clampPage(){
    if(!pdfDoc) return;
    if(pageNum < 1) pageNum = 1;
    if(pageNum > pageCount) pageNum = pageCount;
  }

  btnPrev.addEventListener("click", () => {
    if(!pdfDoc) return;
    pageNum--;
    clampPage();
    renderPage();
  });

  btnNext.addEventListener("click", () => {
    if(!pdfDoc) return;
    pageNum++;
    clampPage();
    renderPage();
  });

  // -------------------------
  // 4) Tools 펼침/닫힘 같은 리사이즈에 “즉시 안정화”
  // - ResizeObserver로 stage 크기 변하면 현재 페이지를 재렌더
  // -------------------------
  const ro = new ResizeObserver(() => {
    const w = stage.clientWidth;
    const h = stage.clientHeight;

    // 의미 있는 변화일 때만 재렌더
    if(Math.abs(w - lastStageW) > 2 || Math.abs(h - lastStageH) > 2){
      lastStageW = w; lastStageH = h;
      renderPage();
    }
  });
  ro.observe(stage);

  // -------------------------
  // 5) PDF 로드
  // -------------------------
  (async () => {
    showMsg("Loading...");
    try{
      const loadingTask = pdfjsLib.getDocument({
        url: fileUrl,
        // 일부 환경에서 worker/폰트 관련 이슈 줄이기
        useSystemFonts: true,
      });

      pdfDoc = await loadingTask.promise;
      pageCount = pdfDoc.numPages || 0;
      pageNum = 1;
      lastStageW = stage.clientWidth;
      lastStageH = stage.clientHeight;

      updateUI();
      renderPage();
    } catch(e){
      showMsg("PDF open failed. Verify the URL is public and reachable.");
      console.error(e);
    }
  })();

})();
</script>
</body>
</html>
