<!DOCTYPE html>
<html>
<head>
    <title>EPS-TOPIK Flipbook Player</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.0/jquery.min.js"></script>
    <script src="js/pdf.js"></script>
    <script src="js/3dflipbook.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #2d3436; }
        #container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="container"></div>

    <script>
        // URL에서 'file' 파라미터 값을 가져오는 함수
        function getURLParameter(name) {
            return new URLSearchParams(window.location.search).get(name);
        }

        // 지침 11번(소문자 규칙)에 따라 경로를 강제로 소문자로 변환하는 로직 포함
        var pdfFile = getURLParameter('file');
        
        if (pdfFile) {
            // 경로 소문자화 및 확장자 확인
            pdfFile = pdfFile.toLowerCase();
            
            // 플레이어 초기화 로직
            $('#container').FlipBook({
                pdf: pdfFile, // n8n에서 전달한 pdf/eps/u01/ph.pdf 등의 경로
                template: {
                    html: 'templates/default-book-view.html',
                    styles: ['css/short-black-book-view.css'],
                    links: [{rel: 'stylesheet', href: 'css/font-awesome.min.css'}]
                },
                controlsProps: {
                    downloadURL: false // 보안 지침에 따라 다운로드 제한
                }
            });
        } else {
            document.write("<h1 style='color:white; text-align:center; padding-top:20%'>PDF File Not Found</h1>");
        }
    </script>
</body>
</html>
