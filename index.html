<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flipbook Viewer</title>

  <style>
    html,body{height:100%;margin:0;background:#0b0f17;color:#111;font-family:system-ui,-apple-system,Segoe UI,Roboto,Pretendard,sans-serif;}
    .wrap{height:100%;width:100%;display:flex;flex-direction:column;overflow:hidden;}
    .stage{
      flex:1;position:relative;
      display:flex;align-items:center;justify-content:center;
      overflow:hidden;
      background:#0b0f17; /* 외곽 배경(최소 노출) */
    }

    /* ✅ 슬라이드: 최대 확대 + 여백 최소화 */
    canvas{
      display:block;
      max-width:100%;
      max-height:100%;
      border-radius:16px;
      background:#ffffff;
      box-shadow:0 10px 26px rgba(0,0,0,.30);
    }

    /* ===== Bottom controls (Unified EPS/TOPIK2) ===== */
    .bottomBar{
      position:absolute;left:0;right:0;bottom:10px;
      height:48px;
      z-index:10;
      pointer-events:none; /* 버튼만 클릭되게 */
    }

    .navBtn{
      pointer-events:auto;
      position:absolute;bottom:0;
      width:36px;height:36px;border-radius:999px;
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;user-select:none;
      background:rgba(255,255,255,.88);
      border:1px solid rgba(0,0,0,.10);
      box-shadow:0 10px 20px rgba(0,0,0,.18);
      backdrop-filter: blur(6px);
      transition: transform .12s ease, opacity .12s ease, background .12s ease;
    }
    .navBtn:hover{ transform:translateY(-1px); background:rgba(255,255,255,.94); }
    .navBtn:active{ transform:translateY(0px) scale(.98); }
    .navBtn.disabled{ opacity:.35; cursor:not-allowed; transform:none; }

    .navBtn.left{ left:12px; }
    .navBtn.right{ right:12px; }

    /* ✅ 아이콘은 검정(흰 배경/검은 배경 모두 가시성) */
    .navBtn svg{ width:18px;height:18px; fill:#111; opacity:.92; }
    .navBtn.disabled svg{ opacity:.45; }

    /* ✅ Page 텍스트: 하단 중앙 */
    .pagePill{
      pointer-events:none;
      position:absolute;left:50%;bottom:0;transform:translateX(-50%);
      height:36px;min-width:118px;
      display:flex;align-items:center;justify-content:center;
      padding:0 12px;
      border-radius:999px;
      background:rgba(255,255,255,.72);
      border:1px solid rgba(0,0,0,.08);
      box-shadow:0 10px 20px rgba(0,0,0,.14);
      backdrop-filter: blur(6px);
      font-size:12px;
      font-weight:900;
      color:rgba(17,17,17,.55); /* ✅ “중간 회색” 톤 */
      letter-spacing:-.1px;
    }

    /* ✅ 좌/우 탭존(슬라이드 영역 클릭으로 넘김) — 하단바 영역은 비워둠 */
    .tapZone{
      position:absolute;top:0;bottom:58px; /* ✅ 하단 컨트롤 영역 보호 */
      width:22%;
      cursor:pointer;user-select:none;
      z-index:5;
    }
    .tapLeft{left:0;}
    .tapRight{right:0;}

    /* 로딩/에러 */
    .msg{
      position:absolute;inset:0;
      display:flex;align-items:center;justify-content:center;
      font-size:13px;opacity:.85;text-align:center;padding:16px;
      z-index:2;color:#e8eefc;
    }
  </style>

  <!-- pdf.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body>
<div class="wrap">
  <div class="stage" id="stage">

    <!-- tap zones -->
    <div class="tapZone tapLeft" id="tapLeft" aria-label="Previous page"></div>
    <canvas id="c"></canvas>
    <div class="tapZone tapRight" id="tapRight" aria-label="Next page"></div>

    <!-- bottom unified controls -->
    <div class="bottomBar" aria-label="Page controls">
      <div class="navBtn left" id="btnPrev" aria-label="Previous page" title="Previous">
        <!-- left chevron -->
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 19a1 1 0 0 1-.7-.3l-6-6a1 1 0 0 1 0-1.4l6-6a1 1 0 1 1 1.4 1.4L10.91 12l5.29 5.3A1 1 0 0 1 15.5 19z"/></svg>
      </div>

      <div class="pagePill" id="pagePill">Page - / -</div>

      <div class="navBtn right" id="btnNext" aria-label="Next page" title="Next">
        <!-- right chevron -->
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 19a1 1 0 0 1-.7-1.7L13.09 12 7.8 6.7A1 1 0 1 1 9.2 5.3l6 6a1 1 0 0 1 0 1.4l-6 6a1 1 0 0 1-.7.3z"/></svg>
      </div>
    </div>

    <div class="msg" id="msg">Loading…</div>
  </div>
</div>

<script>
  // worker CDN
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const $ = (id)=>document.getElementById(id);
  const canvas = $("c");
  const ctx = canvas.getContext("2d", { alpha: false });
  const stage = $("stage");
  const msg = $("msg");

  const btnPrev = $("btnPrev");
  const btnNext = $("btnNext");
  const pagePill = $("pagePill");

  let pdfDoc = null;
  let pageNum = 1;
  let rendering = false;
  let pending = null;
  let lastPageViewport1 = null;

  function getFileFromQuery(){
    const u = new URL(location.href);
    return u.searchParams.get("file") || "";
  }

  function setMsg(t){
    msg.style.display = t ? "flex" : "none";
    msg.textContent = t || "";
  }

  function setControls(){
    if(!pdfDoc){
      pagePill.textContent = "Page - / -";
      btnPrev.classList.add("disabled");
      btnNext.classList.add("disabled");
      return;
    }
    pagePill.textContent = `Page ${pageNum} / ${pdfDoc.numPages}`;
    btnPrev.classList.toggle("disabled", pageNum <= 1);
    btnNext.classList.toggle("disabled", pageNum >= pdfDoc.numPages);
  }

  // ✅ 최대 확대: 여백 최소, 하단 컨트롤만 아주 조금 확보
  function calcScaleToFit(viewport1){
    const padding = 6;          // 전체 여백 최소
    const reservedBottom = 56;  // 하단 버튼/페이지 영역
    const reservedTop = 6;      // 상단 여백 최소

    const maxW = Math.max(200, stage.clientWidth  - padding);
    const maxH = Math.max(200, stage.clientHeight - padding - reservedBottom - reservedTop);

    const s = Math.min(maxW / viewport1.width, maxH / viewport1.height);
    return Math.max(0.1, s);
  }

  async function renderPage(num){
    rendering = true;
    setMsg("Loading…");

    const page = await pdfDoc.getPage(num);
    lastPageViewport1 = page.getViewport({ scale: 1 });

    const scale = calcScaleToFit(lastPageViewport1);
    const viewport = page.getViewport({ scale });

    const dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width  = Math.floor(viewport.width  * dpr);
    canvas.height = Math.floor(viewport.height * dpr);
    canvas.style.width  = Math.floor(viewport.width) + "px";
    canvas.style.height = Math.floor(viewport.height) + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    try{
      await page.render({ canvasContext: ctx, viewport }).promise;
      setMsg("");
    }catch(e){
      console.error(e);
      setMsg("Render failed. Check console.");
    }

    setControls();
    rendering = false;

    if(pending !== null){
      const p = pending;
      pending = null;
      renderPage(p);
    }
  }

  function queueRender(num){
    if(rendering) pending = num;
    else renderPage(num);
  }

  function prev(){
    if(!pdfDoc || pageNum <= 1) return;
    pageNum--;
    queueRender(pageNum);
  }

  function next(){
    if(!pdfDoc || pageNum >= pdfDoc.numPages) return;
    pageNum++;
    queueRender(pageNum);
  }

  // clicks
  btnPrev.addEventListener("click", ()=>{ if(!btnPrev.classList.contains("disabled")) prev(); });
  btnNext.addEventListener("click", ()=>{ if(!btnNext.classList.contains("disabled")) next(); });

  $("tapLeft").addEventListener("click", prev);
  $("tapRight").addEventListener("click", next);

  // keyboard
  window.addEventListener("keydown", (e)=>{
    if(e.key === "ArrowLeft") prev();
    if(e.key === "ArrowRight") next();
  });

  // resize
  const ro = new ResizeObserver(()=>{
    if(pdfDoc && lastPageViewport1){
      queueRender(pageNum);
    }
  });
  ro.observe(stage);

  async function loadPdf(url){
    if(!url){
      setMsg("No PDF URL.\nOpen with ?file=ENCODED_PDF_URL");
      setControls();
      return;
    }

    setMsg("Loading…");
    try{
      const task = pdfjsLib.getDocument({ url });
      pdfDoc = await task.promise;
      pageNum = 1;
      setControls();
      queueRender(pageNum);
    }catch(e){
      console.error(e);
      setMsg("PDF load failed. Check console.");
      setControls();
    }
  }

  // init
  loadPdf(getFileFromQuery());
</script>
</body>
</html>
