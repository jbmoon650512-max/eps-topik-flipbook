<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>EPS-TOPIK Flipbook Player</title>
    <script src="js/jquery.min.js"></script>
    <script src="js/pdf.min.js"></script>
    <script src="js/3dflipbook.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #2d3436; }
        #fb-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="fb-container"></div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let pdfPath = urlParams.get('file');

        if (pdfPath) {
            // 지침 11번 준수: 모든 경로는 소문자로 인식
            pdfPath = pdfPath.toLowerCase();

            $('#fb-container').FlipBook({
                pdf: pdfPath,
                template: {
                    html: 'templates/default-book-view.html',
                    styles: ['css/short-white-book-view.css'],
                    links: [{ rel: 'stylesheet', href: 'css/font-awesome.min.css' }]
                },
                controlsProps: {
                    downloadURL: false, // 지침 7번: eBook 다운로드 방지 보호
                    printURL: false
                }
            });
        } else {
            document.body.innerHTML = '<h2 style="color:white; text-align:center; margin-top:20%;">PDF File Path Missing</h2>';
        }
    </script>
</body>
</html>
