<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>JB Flipbook Viewer</title>

  <!-- pdf.js (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root{
      --bg:#050814;
      --panel:#0b1220;
      --btn-bg:rgba(255,255,255,.10);
      --btn-bg-hover:rgba(255,255,255,.18);
      --btn-size:36px;                 /* ✅ 스펙: 36px */
      --btn-radius:999px;
      --safe-pad:14px;
      --ink:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.55);
      --muted-bg:rgba(255,255,255,.14);
    }

    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      overflow:hidden;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Pretendard,sans-serif;
    }

    /* 전체 프레임(검은 배경은 “프레임”으로 보이게) */
    .jb-root{
      position:fixed;
      inset:0;
      background:linear-gradient(180deg, #070b18 0%, #050814 100%);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* 캔버스를 최대한 꽉 채우되, 둥근 프레임/그림자 유지 */
    .jb-stage{
      position:relative;
      width:100%;
      height:100%;
      background:transparent;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* 실제 렌더 영역(캔버스가 꽉 차게 fit) */
    .jb-canvas-wrap{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:var(--safe-pad);
      box-sizing:border-box;
    }

    canvas{
      display:block;
      border-radius:16px;
      box-shadow:0 12px 34px rgba(0,0,0,.45);
      background:#0b1220;
    }

    /* ✅ 버튼: 좌/우 하단 고정, 텍스트 없음 */
    .jb-btn{
      position:absolute;
      bottom:var(--safe-pad);
      width:var(--btn-size);
      height:var(--btn-size);
      border-radius:var(--btn-radius);
      border:1px solid rgba(255,255,255,.18);
      background:var(--btn-bg);
      color:var(--ink);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      box-shadow:0 10px 24px rgba(0,0,0,.25);
      backdrop-filter: blur(6px);
    }
    .jb-btn:hover{ background:var(--btn-bg-hover); }
    .jb-btn:active{ transform: translateY(1px); }
    .jb-btn[aria-disabled="true"]{
      opacity:.28;
      cursor:not-allowed;
      pointer-events:none;
    }
    .jb-prev{ left:var(--safe-pad); }
    .jb-next{ right:var(--safe-pad); }

    /* ✅ 페이지 인디케이터: 하단 중앙, 옅은 회색, 반투명 */
    .jb-page{
      position:absolute;
      bottom:calc(var(--safe-pad) + 2px);
      left:50%;
      transform:translateX(-50%);
      padding:6px 10px;
      border-radius:999px;
      background:var(--muted-bg);
      border:1px solid rgba(255,255,255,.12);
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      letter-spacing:.02em;
      user-select:none;
      backdrop-filter: blur(6px);
      pointer-events:none;
    }

    /* 상단 최소 컨트롤(확대/축소) — 화면을 더럽히지 않게 */
    .jb-zoombar{
      position:absolute;
      top:var(--safe-pad);
      right:var(--safe-pad);
      display:flex;
      gap:8px;
      align-items:center;
      z-index:5;
    }
    .jb-zoom{
      width:var(--btn-size);
      height:var(--btn-size);
      border-radius:var(--btn-radius);
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.08);
      color:var(--ink);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      backdrop-filter: blur(6px);
    }
    .jb-zoom:hover{ background:rgba(255,255,255,.14); }
    .jb-zoom:active{ transform: translateY(1px); }

    /* 로딩/에러 */
    .jb-overlay{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      color:rgba(255,255,255,.75);
      font-weight:800;
      font-size:14px;
      letter-spacing:.01em;
      padding:24px;
      text-align:center;
    }
    .jb-hide{ display:none; }

    /* 작은 화면에서 여백 최소화 */
    @media (max-width:768px){
      :root{ --safe-pad:10px; }
      canvas{ border-radius:14px; }
    }
  </style>
</head>

<body>
  <div class="jb-root">
    <div class="jb-stage" id="stage">
      <div class="jb-canvas-wrap">
        <canvas id="pdfCanvas"></canvas>
      </div>

      <div class="jb-overlay" id="overlay">Loading…</div>

      <div class="jb-zoombar" aria-label="zoom controls">
        <div class="jb-zoom" id="zoomOut" title="Zoom out" aria-label="Zoom out">−</div>
        <div class="jb-zoom" id="zoomIn"  title="Zoom in"  aria-label="Zoom in">+</div>
      </div>

      <div class="jb-btn jb-prev" id="prevBtn" title="Previous page" aria-label="Previous page">
        <!-- chevron-left -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="jb-btn jb-next" id="nextBtn" title="Next page" aria-label="Next page">
        <!-- chevron-right -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="jb-page" id="pageInd">Page 0 / 0</div>
    </div>
  </div>

  <script>
    (function(){
      // --- pdf.js binding (CDN 안정)
      const pdfjsLib = window.pdfjsLib || (window['pdfjs-dist/build/pdf'] || null);
      if (!pdfjsLib) {
        document.getElementById('overlay').textContent = 'pdf.js failed to load.';
        return;
      }

      // Worker (CDN)
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      // --- DOM
      const canvas = document.getElementById('pdfCanvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      const overlay = document.getElementById('overlay');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const pageInd = document.getElementById('pageInd');
      const zoomIn = document.getElementById('zoomIn');
      const zoomOut = document.getElementById('zoomOut');

      // --- State
      let pdfDoc = null;
      let pageNum = 1;
      let pageCount = 0;

      // “프레임 꽉 채움”을 위한 baseScale + 사용자 줌
      let userZoom = 1.0;                 // 1.0 기준
      const ZOOM_STEP = 0.12;
      const ZOOM_MIN  = 0.72;
      const ZOOM_MAX  = 2.50;             // ✅ 최대 확대 (검은 배경 최소화)

      let rendering = false;
      let pending = false;

      // --- Helpers
      function qs(name){
        const u = new URL(location.href);
        return u.searchParams.get(name) || '';
      }

      function setOverlay(msg){
        overlay.textContent = msg || '';
        overlay.classList.toggle('jb-hide', !msg);
      }

      function setDisabled(btn, v){
        btn.setAttribute('aria-disabled', v ? 'true' : 'false');
      }

      function updateNav(){
        pageInd.textContent = `Page ${pageNum} / ${pageCount}`;
        setDisabled(prevBtn, pageNum <= 1);
        setDisabled(nextBtn, pageNum >= pageCount);
      }

      // “현재 iframe 크기 변화(툴 펼침/접힘)”에 강하게 대응:
      // ResizeObserver + rAF debounce
      let resizeRAF = 0;
      function onResize(){
        cancelAnimationFrame(resizeRAF);
        resizeRAF = requestAnimationFrame(() => {
          queueRender();
        });
      }

      // --- Core render (Fit-to-frame)
      async function renderPage(num){
        if (!pdfDoc) return;
        rendering = true;

        try{
          const page = await pdfDoc.getPage(num);

          // 1) 먼저 원본 뷰포트(스케일 1.0)로 크기 얻기
          const viewport1 = page.getViewport({ scale: 1.0 });

          // 2) 현재 화면에 “최대한 꽉 채우는” baseScale 계산
          //    - 검은 공간이 “빈 공간”으로 안 보이게, 캔버스를 가급적 꽉 채움
          const pad = 14; // css safe-pad와 유사 (렌더 계산용 고정)
          const availW = Math.max(320, window.innerWidth  - pad*2);
          const availH = Math.max(320, window.innerHeight - pad*2);

          const scaleFit = Math.min(availW / viewport1.width, availH / viewport1.height);

          // 3) userZoom 적용
          const scale = scaleFit * userZoom;

          const viewport = page.getViewport({ scale });

          // 4) 캔버스 설정
          const dpr = Math.min(2, window.devicePixelRatio || 1);
          canvas.width  = Math.floor(viewport.width  * dpr);
          canvas.height = Math.floor(viewport.height * dpr);
          canvas.style.width  = Math.floor(viewport.width)  + 'px';
          canvas.style.height = Math.floor(viewport.height) + 'px';

          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.imageSmoothingEnabled = true;

          // 5) 렌더
          const renderTask = page.render({
            canvasContext: ctx,
            viewport
          });

          await renderTask.promise;
          setOverlay('');
          updateNav();
        } catch(e){
          console.error(e);
          setOverlay('Failed to render PDF page.');
        } finally{
          rendering = false;
          if (pending){
            pending = false;
            renderPage(pageNum);
          }
        }
      }

      function queueRender(){
        if (!pdfDoc) return;
        if (rendering){
          pending = true;
          return;
        }
        renderPage(pageNum);
      }

      function goPrev(){
        if (!pdfDoc || pageNum <= 1) return;
        pageNum--;
        updateNav();
        queueRender();
      }

      function goNext(){
        if (!pdfDoc || pageNum >= pageCount) return;
        pageNum++;
        updateNav();
        queueRender();
      }

      function zoom(delta){
        const next = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, +(userZoom + delta).toFixed(3)));
        if (next === userZoom) return;
        userZoom = next;
        queueRender();
      }

      // --- Touch swipe (optional but helpful on mobile)
      let touchX = 0;
      let touchY = 0;
      let touchT = 0;

      function onTouchStart(e){
        const t = e.touches && e.touches[0];
        if (!t) return;
        touchX = t.clientX;
        touchY = t.clientY;
        touchT = Date.now();
      }
      function onTouchEnd(e){
        const t = e.changedTouches && e.changedTouches[0];
        if (!t) return;
        const dx = t.clientX - touchX;
        const dy = t.clientY - touchY;
        const dt = Date.now() - touchT;

        // 가로 스와이프만
        if (dt < 600 && Math.abs(dx) > 60 && Math.abs(dy) < 80){
          if (dx > 0) goPrev();
          else goNext();
        }
      }

      // --- Load PDF
      async function load(){
        const file = qs('file');
        if (!file){
          setOverlay('No PDF file specified.\nUse: index.html?file=PDF_URL');
          return;
        }

        setOverlay('Loading PDF…');

        try{
          // CORS 친화
          const loadingTask = pdfjsLib.getDocument({
            url: file,
            withCredentials: false,
            // 일부 환경에서 캐시/요청 안정성
            disableStream: false,
            disableAutoFetch: false
          });

          pdfDoc = await loadingTask.promise;
          pageCount = pdfDoc.numPages;
          pageNum = 1;

          updateNav();
          queueRender();
        } catch(e){
          console.error(e);
          setOverlay('Failed to load PDF.\n(If this persists, check the PDF URL / CORS.)');
        }
      }

      // --- Events
      prevBtn.addEventListener('click', goPrev);
      nextBtn.addEventListener('click', goNext);
      zoomIn.addEventListener('click', ()=>zoom(+ZOOM_STEP));
      zoomOut.addEventListener('click', ()=>zoom(-ZOOM_STEP));

      window.addEventListener('keydown', (e)=>{
        if (e.key === 'ArrowLeft')  goPrev();
        if (e.key === 'ArrowRight') goNext();
        if (e.key === '+' || e.key === '=') zoom(+ZOOM_STEP);
        if (e.key === '-') zoom(-ZOOM_STEP);
      });

      window.addEventListener('resize', onResize);
      window.addEventListener('orientationchange', onResize);
      document.addEventListener('visibilitychange', ()=>{
        if (!document.hidden) onResize();
      });

      // WP에서 Tools 펼침/접힘 등으로 iframe 크기가 변할 때도 즉시 반응
      try{
        const ro = new ResizeObserver(onResize);
        ro.observe(document.documentElement);
        ro.observe(document.body);
      } catch(_){}

      // Touch
      window.addEventListener('touchstart', onTouchStart, { passive:true });
      window.addEventListener('touchend', onTouchEnd, { passive:true });

      // 외부에서 강제 리프레시가 필요하면 postMessage로 트리거 가능
      // (필요 시 WP Runtime에서 iframe.contentWindow.postMessage('jb:refresh','*') 호출)
      window.addEventListener('message', (ev)=>{
        if (ev && ev.data === 'jb:refresh') onResize();
      });

      load();
    })();
  </script>
</body>
</html>
