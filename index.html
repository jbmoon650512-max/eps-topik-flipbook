<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JB Flipbook Viewer</title>

  <!-- ✅ PDF.js (Legacy global build: pdfjsLib 보장) -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>

  <style>
    :root{
      --bg:#0b1220;
      --btn:36px;          /* ✅ spec: 36px */
      --radius:16px;
    }
    html,body{height:100%; margin:0; background:var(--bg); overflow:hidden;}
    *{box-sizing:border-box; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}

    .wrap{
      position:fixed; inset:0;
      background:var(--bg);
      display:flex; align-items:center; justify-content:center;
    }

    /* ✅ slide area: 최대 확대(검은 배경 최소화) */
    .stage{
      position:relative;
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:10px;
    }

    canvas{
      background:#fff;
      border-radius:14px;
      box-shadow:0 14px 40px rgba(0,0,0,.35);
      max-width:100%;
      max-height:100%;
    }

    /* ✅ buttons: 좌/우 하단 고정 + 텍스트 없음 */
    .btn{
      width:var(--btn);
      height:var(--btn);
      border-radius:999px;
      border:none;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.12);
      color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,.25);
      backdrop-filter: blur(6px);
      transition:transform .12s ease, background .12s ease, opacity .12s ease;
      user-select:none;
    }
    .btn:hover{ transform:translateY(-1px); background:rgba(255,255,255,.18); }
    .btn:active{ transform:translateY(0); }
    .btn:disabled{ opacity:.25; cursor:not-allowed; }

    .btn-left{
      position:absolute;
      left:14px;
      bottom:14px;
      z-index:50;
    }
    .btn-right{
      position:absolute;
      right:14px;
      bottom:14px;
      z-index:50;
    }

    /* ✅ page indicator: 하단 중앙 */
    .page-ind{
      position:absolute;
      left:50%;
      bottom:16px;
      transform:translateX(-50%);
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      color:rgba(203,213,225,.78);
      background:rgba(15,23,42,.38);
      border:1px solid rgba(148,163,184,.18);
      backdrop-filter: blur(6px);
      z-index:50;
      pointer-events:none;
    }

    .toast{
      position:absolute;
      top:12px;
      left:50%;
      transform:translateX(-50%);
      padding:8px 12px;
      border-radius:999px;
      font-size:12px;
      font-weight:900;
      color:#e2e8f0;
      background:rgba(15,23,42,.55);
      border:1px solid rgba(148,163,184,.18);
      backdrop-filter: blur(6px);
      z-index:60;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="stage" id="stage">
      <button class="btn btn-left" id="prev" aria-label="Previous">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <canvas id="canvas"></canvas>

      <button class="btn btn-right" id="next" aria-label="Next">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="page-ind" id="pageInd">Page 0 / 0</div>
      <div class="toast" id="toast" style="display:none">Loading...</div>
    </div>
  </div>

  <script>
    (function(){
      // ✅ worker도 동일 출처로 고정 (혼선/차단 방지)
      if (window.pdfjsLib && pdfjsLib.GlobalWorkerOptions) {
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
      }

      const qs = new URLSearchParams(location.search);
      let file = qs.get("file"); // expects FULL URL (encoded)

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d", { alpha:false });

      const prevBtn = document.getElementById("prev");
      const nextBtn = document.getElementById("next");
      const pageInd = document.getElementById("pageInd");
      const toast = document.getElementById("toast");

      let pdfDoc = null;
      let pageNum = 1;
      let isRendering = false;
      let pending = false;
      let lastW = 0, lastH = 0;

      function showToast(msg){
        toast.style.display = "block";
        toast.textContent = msg;
      }
      function hideToast(){ toast.style.display = "none"; }

      function setIndicator(){
        const total = pdfDoc ? pdfDoc.numPages : 0;
        pageInd.textContent = `Page ${total ? pageNum : 0} / ${total}`;
      }
      function setButtons(){
        const total = pdfDoc ? pdfDoc.numPages : 0;
        prevBtn.disabled = !(total && pageNum > 1);
        nextBtn.disabled = !(total && pageNum < total);
      }

      function stageSize(){
        const stage = document.getElementById("stage");
        const rect = stage.getBoundingClientRect();
        return { w: rect.width - 20, h: rect.height - 20 };
      }

      async function renderPage(num){
        if(!pdfDoc) return;

        if(isRendering){
          pending = true;
          return;
        }
        isRendering = true;

        try{
          const page = await pdfDoc.getPage(num);
          const { w, h } = stageSize();
          lastW = w; lastH = h;

          const unscaled = page.getViewport({ scale: 1 });
          const scale = Math.min(w / unscaled.width, h / unscaled.height);
          const viewport = page.getViewport({ scale });

          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);

          ctx.setTransform(1,0,0,1,0,0);
          ctx.clearRect(0,0,canvas.width,canvas.height);

          await page.render({ canvasContext: ctx, viewport }).promise;

          setIndicator();
          setButtons();
        } catch(e){
          pdfDoc = null;
          pageInd.textContent = "Page 0 / 0";
          prevBtn.disabled = true;
          nextBtn.disabled = true;
          showToast("Failed to render");
          console.error(e);
        } finally{
          isRendering = false;
          if(pending){
            pending = false;
            renderPage(pageNum);
          }
        }
      }

      async function loadPdf(){
        if(!window.pdfjsLib){
          showToast("PDF.js not loaded");
          console.error("pdfjsLib is missing. Check CDN load / CORB.");
          return;
        }

        if(!file){
          showToast("Missing file parameter");
          pageInd.textContent = "Page 0 / 0";
          prevBtn.disabled = true;
          nextBtn.disabled = true;
          return;
        }

        showToast("Loading...");
        try{
          // ✅ file 파라미터는 보통 encodeURIComponent 되어 들어옴
          // 이미 decode된 값이면 그대로 사용해도 문제 없음
          const url = file;

          pdfDoc = await pdfjsLib.getDocument({
            url,
            withCredentials: false
          }).promise;

          pageNum = 1;
          hideToast();
          setIndicator();
          setButtons();
          renderPage(pageNum);
        } catch(e){
          pdfDoc = null;
          pageInd.textContent = "Page 0 / 0";
          prevBtn.disabled = true;
          nextBtn.disabled = true;
          showToast("Failed to load PDF");
          console.error(e);
        }
      }

      function go(delta){
        if(!pdfDoc) return;
        const next = pageNum + delta;
        if(next < 1 || next > pdfDoc.numPages) return;
        pageNum = next;
        renderPage(pageNum);
      }

      prevBtn.addEventListener("click", ()=>go(-1));
      nextBtn.addEventListener("click", ()=>go(1));

      // ✅ 리사이즈 안정화
      let t = null;
      function scheduleResize(){
        clearTimeout(t);
        t = setTimeout(()=>{
          if(!pdfDoc) return;
          const { w, h } = stageSize();
          if(Math.abs(w-lastW) > 1 || Math.abs(h-lastH) > 1){
            renderPage(pageNum);
          }
        }, 80);
      }
      window.addEventListener("resize", scheduleResize);

      // ✅ 부모가 강제 리렌더 트리거 가능
      window.addEventListener("message", (ev)=>{
        const msg = ev && ev.data;
        if(msg && msg.type === "JB_VIEWER_FORCE_RESIZE"){
          scheduleResize();
        }
      });

      loadPdf();
    })();
  </script>
</body>
</html>
