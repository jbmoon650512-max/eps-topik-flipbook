<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>JB Flipbook Viewer</title>

  <!-- pdf.js (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.js"></script>

  <style>
    :root{
      --bg:#0b1220;
      --frame:#000;
      --btnSize:36px;
      --btnBg:rgba(255,255,255,.85);
      --btnFg:#111827; /* 진한 회색/검정 */
      --pillBg:rgba(255,255,255,.10);
      --pillFg:rgba(255,255,255,.45); /* 아주 옅은 회색 */
    }

    html, body { height:100%; margin:0; background:var(--bg); }
    body{ overflow:hidden; font-family:system-ui,-apple-system,Segoe UI,Roboto,Pretendard,sans-serif; }

    /* Viewport: slide is the protagonist */
    .stage{
      position:relative;
      height:100vh;
      width:100vw;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--bg);
      padding:8px; /* 검은 배경 최소화 */
      box-sizing:border-box;
    }

    .frame{
      position:relative;
      width:100%;
      height:100%;
      background:var(--frame);
      border-radius:14px;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    canvas{
      /* 핵심: 최대 확대 + 여백 최소화 */
      max-width:100%;
      max-height:100%;
      width:auto;
      height:auto;
      display:block;
      background:transparent;
    }

    /* Controls: bottom row */
    .controls{
      position:absolute;
      left:0; right:0; bottom:10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 12px;
      pointer-events:none; /* 버튼만 클릭되게 */
    }

    .btn{
      width:var(--btnSize);
      height:var(--btnSize);
      border-radius:999px;
      border:0;
      background:var(--btnBg);
      color:var(--btnFg);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      font-size:18px;
      cursor:pointer;
      box-shadow:0 6px 18px rgba(0,0,0,.28);
      pointer-events:auto;
      user-select:none;
    }
    .btn:disabled{
      opacity:.35;
      cursor:not-allowed;
    }

    /* Page indicator: bottom center, subtle, not blocking */
    .page-ind{
      pointer-events:none;
      padding:6px 10px;
      border-radius:999px;
      background:var(--pillBg);
      color:var(--pillFg);
      font-weight:800;
      font-size:12px;
      letter-spacing:.2px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    /* Small screens: tighter */
    @media (max-width:768px){
      .stage{ padding:6px; }
      .controls{ bottom:8px; padding:0 10px; }
      .page-ind{ font-size:11px; padding:5px 9px; }
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="frame">
      <canvas id="pdfCanvas"></canvas>

      <div class="controls">
        <!-- Prev / Next 텍스트는 존재하지 않음 (아이콘만) -->
        <button class="btn" id="prevBtn" aria-label="Previous page">&lt;</button>
        <div class="page-ind" id="pageInd">Page 0 / 0</div>
        <button class="btn" id="nextBtn" aria-label="Next page">&gt;</button>
      </div>
    </div>
  </div>

  <script>
    // ===== JB Flipbook Viewer (EPS/TOPIK II 공통) =====
    // URL pattern: index.html?file=<PDF_URL or relative_path>
    // Example: index.html?file=pdf/eps/u01/ph.pdf

    const urlParams = new URLSearchParams(location.search);
    const fileParam = urlParams.get("file");

    // If relative path, resolve against current origin/path.
    const resolvedPdfUrl = (() => {
      if (!fileParam) return null;
      try {
        // Absolute URL
        new URL(fileParam);
        return fileParam;
      } catch (e) {
        // Relative -> resolve against current location
        const base = location.href.split("?")[0];
        return new URL(fileParam, base).toString();
      }
    })();

    // pdf.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.js";

    const canvas = document.getElementById("pdfCanvas");
    const ctx = canvas.getContext("2d", { alpha: true });

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const pageInd = document.getElementById("pageInd");

    let pdfDoc = null;
    let pageNum = 1;
    let rendering = false;
    let pendingNum = null;

    function setButtons(){
      if (!pdfDoc) {
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        pageInd.textContent = "Page 0 / 0";
        return;
      }
      prevBtn.disabled = (pageNum <= 1);
      nextBtn.disabled = (pageNum >= pdfDoc.numPages);
      pageInd.textContent = `Page ${pageNum} / ${pdfDoc.numPages}`;
    }

    // 핵심: 슬라이드를 “화면의 주인공”으로 만드는 scale
    function calcBestScale(viewport){
      // frame의 가용 영역(controls는 overlay라 실제 줄일 필요 없음)
      const frame = document.querySelector(".frame");
      const rect = frame.getBoundingClientRect();

      // 약간의 안전 여백만 남기고 최대 확대
      const pad = 10; // 너무 크면 검은 배경이 커짐
      const availW = Math.max(10, rect.width - pad * 2);
      const availH = Math.max(10, rect.height - pad * 2);

      const scaleW = availW / viewport.width;
      const scaleH = availH / viewport.height;

      // 화면에 “꽉 차게” 맞추는 scale
      return Math.min(scaleW, scaleH);
    }

    async function renderPage(num){
      rendering = true;

      const page = await pdfDoc.getPage(num);

      // 1) 1.0 viewport로 기준 크기 확보
      const baseViewport = page.getViewport({ scale: 1 });

      // 2) best scale 계산 후 최종 viewport
      const scale = calcBestScale(baseViewport);
      const viewport = page.getViewport({ scale });

      // 3) 캔버스 픽셀 레티나 대응
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.floor(viewport.width * dpr);
      canvas.height = Math.floor(viewport.height * dpr);
      canvas.style.width = Math.floor(viewport.width) + "px";
      canvas.style.height = Math.floor(viewport.height) + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, viewport.width, viewport.height);

      const renderTask = page.render({ canvasContext: ctx, viewport });
      await renderTask.promise;

      rendering = false;
      setButtons();

      if (pendingNum !== null){
        const next = pendingNum;
        pendingNum = null;
        renderPage(next);
      }
    }

    function queueRender(num){
      if (rendering){
        pendingNum = num;
        return;
      }
      renderPage(num);
    }

    prevBtn.addEventListener("click", () => {
      if (!pdfDoc || pageNum <= 1) return;
      pageNum -= 1;
      queueRender(pageNum);
    });

    nextBtn.addEventListener("click", () => {
      if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
      pageNum += 1;
      queueRender(pageNum);
    });

  // ResizeObserver: detects container size changes (e.g., WP Tools open/close)
(() => {
  const frameEl = document.querySelector(".frame");
  if (!frameEl || !("ResizeObserver" in window)) return;

  let roT = null;
  const ro = new ResizeObserver(() => {
    if (!pdfDoc) return;
    clearTimeout(roT);
    roT = setTimeout(() => queueRender(pageNum), 80);
  });
  ro.observe(frameEl);
})();

    async function init(){
      if (!resolvedPdfUrl){
        pageInd.textContent = "Page 0 / 0";
        alert("Missing PDF. Use: index.html?file=YOUR_PDF_URL");
        return;
      }

      try{
        const loadingTask = pdfjsLib.getDocument({ url: resolvedPdfUrl });
        pdfDoc = await loadingTask.promise;
        pageNum = 1;
        setButtons();
        await renderPage(pageNum);
      } catch(err){
        console.error(err);
        alert("Failed to load PDF. Check URL / CORS / path.");
      }
    }

    init();
  </script>
</body>
</html>
