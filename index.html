<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EPS Flipbook Viewer</title>

  <style>
    html,body{height:100%;margin:0;background:#0b0f17;color:#e8eefc;font-family:system-ui,-apple-system,Segoe UI,Roboto,Pretendard,sans-serif;}
    .wrap{height:100%;width:100%;display:flex;flex-direction:column;overflow:hidden;}
    .stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0b0f17;}

    /* ✅ 슬라이드: 크게 보이되 "테두리 의식" 최소 */
    canvas{
      display:block;max-width:100%;max-height:100%;
      border-radius:14px;background:#0f1624;
      box-shadow:0 10px 26px rgba(0,0,0,.45);
    }

    /* =========================
       UI MODE A: TOPIK II (BOTTOM BAR)
       ========================= */
    .controlBar{
      position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
      display:flex;align-items:center;gap:10px;
      padding:10px 12px;border-radius:999px;
      background:rgba(15,22,36,.70);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(8px);
      z-index:8;user-select:none;
    }
    .ctrlBtn{
      min-width:84px;height:40px;
      display:flex;align-items:center;justify-content:center;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.14);
      color:#e8eefc;font-weight:900;font-size:13px;
      cursor:pointer;
      transition: transform .12s ease, opacity .12s ease, background .12s ease;
    }
    .ctrlBtn:hover{ background:rgba(255,255,255,.12); }
    .ctrlBtn:active{ transform:scale(.98); }
    .ctrlBtn.disabled{ opacity:.38; cursor:not-allowed; }
    .pageText{ min-width:92px;text-align:center;font-size:12px;font-weight:950;color:#e8eefc;opacity:.95;padding:0 6px; }

    /* =========================
       UI MODE B: EPS (CORNER BUTTONS)
       - 콘텐츠 가림 최소화: 상단 모서리 + 더 투명
       ========================= */
    .cornerNav{
      position:absolute;top:12px;left:12px;right:12px;
      display:flex;justify-content:space-between;align-items:flex-start;
      z-index:9;pointer-events:none; /* 버튼만 클릭되게 */
    }
    .cornerBtn{
      pointer-events:auto;
      width:44px;height:44px;border-radius:999px;
      display:flex;align-items:center;justify-content:center;
      background:rgba(15,22,36,.22);           /* ✅ 더 흐리게 */
      border:1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(6px);
      color:#e8eefc;
      font-size:22px;font-weight:900;
      opacity:.55;                             /* ✅ 더 흐리게 */
      cursor:pointer;user-select:none;
      transition: opacity .12s ease, transform .12s ease;
    }
    .cornerBtn:hover{ opacity:.78; }
    .cornerBtn:active{ transform:scale(.96); opacity:.9; }
    .cornerBtn.disabled{ opacity:.18; cursor:not-allowed; }

    /* ✅ 중앙 페이지 배지 (EPS에서만 사용) */
    .pageBadge{
      position:absolute;top:12px;left:50%;transform:translateX(-50%);
      padding:6px 10px;border-radius:999px;
      background:rgba(15,22,36,.28);
      border:1px solid rgba(255,255,255,.10);
      font-size:12px;font-weight:850;
      z-index:8;user-select:none;
    }

    /* ✅ 좌/우 탭존(공통) */
    .tapZone{
      position:absolute;top:0;bottom:0;width:22%;
      cursor:pointer;user-select:none;z-index:5;
    }
    .tapLeft{left:0;}
    .tapRight{right:0;}

    /* 로딩/에러 */
    .msg{
      position:absolute;inset:0;
      display:flex;align-items:center;justify-content:center;
      font-size:13px;opacity:.85;text-align:center;padding:16px;
      z-index:2;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body>
<div class="wrap">
  <div class="stage" id="stage">

    <!-- MODE A: TOPIK II -->
    <div class="controlBar" id="controlBar" aria-label="Page controls">
      <div class="ctrlBtn" id="btnPrev" aria-label="Previous page">◀ Prev</div>
      <div class="pageText" id="pageText">Page - / -</div>
      <div class="ctrlBtn" id="btnNext" aria-label="Next page">Next ▶</div>
    </div>

    <!-- MODE B: EPS -->
    <div class="cornerNav" id="cornerNav" aria-label="Corner navigation">
      <div class="cornerBtn" id="cPrev" aria-label="Previous page">‹</div>
      <div class="cornerBtn" id="cNext" aria-label="Next page">›</div>
    </div>
    <div class="pageBadge" id="pageBadge">Page - / -</div>

    <!-- common -->
    <div class="tapZone tapLeft" id="tapLeft" aria-label="Previous page"></div>
    <canvas id="c"></canvas>
    <div class="tapZone tapRight" id="tapRight" aria-label="Next page"></div>

    <div class="msg" id="msg">Loading…</div>
  </div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const $ = (id)=>document.getElementById(id);
  const canvas = $("c");
  const ctx = canvas.getContext("2d", { alpha: false });
  const stage = $("stage");
  const msg = $("msg");

  // UI elements
  const controlBar = $("controlBar");
  const btnPrev = $("btnPrev");
  const btnNext = $("btnNext");
  const pageText = $("pageText");

  const cornerNav = $("cornerNav");
  const cPrev = $("cPrev");
  const cNext = $("cNext");
  const badge = $("pageBadge");

  let pdfDoc = null;
  let pageNum = 1;
  let rendering = false;
  let pending = null;
  let lastPageViewport1 = null;

  // ui mode: default 'eps' (corner), topik2 uses 'bottom'
  let uiMode = "eps";

  function getParams(){
    const u = new URL(location.href);
    return {
      file: u.searchParams.get("file") || "",
      ui: (u.searchParams.get("ui") || "").toLowerCase()
    };
  }

  function applyUIMode(mode){
    uiMode = (mode === "bottom") ? "bottom" : "eps";

    // show/hide
    controlBar.style.display = (uiMode === "bottom") ? "flex" : "none";
    cornerNav.style.display  = (uiMode === "bottom") ? "none" : "flex";
    badge.style.display      = (uiMode === "bottom") ? "none" : "block";
  }

  function setMsg(t){
    msg.style.display = t ? "flex" : "none";
    msg.textContent = t || "";
  }

  function setControls(){
    if(!pdfDoc){
      pageText.textContent = "Page - / -";
      badge.textContent = "Page - / -";
      btnPrev.classList.add("disabled");
      btnNext.classList.add("disabled");
      cPrev.classList.add("disabled");
      cNext.classList.add("disabled");
      return;
    }

    const txt = `Page ${pageNum} / ${pdfDoc.numPages}`;
    pageText.textContent = txt;
    badge.textContent = txt;

    const atFirst = pageNum <= 1;
    const atLast  = pageNum >= pdfDoc.numPages;

    btnPrev.classList.toggle("disabled", atFirst);
    btnNext.classList.toggle("disabled", atLast);
    cPrev.classList.toggle("disabled", atFirst);
    cNext.classList.toggle("disabled", atLast);
  }

 function calcScaleToFit(viewport1){
  // ✅ 목표: 슬라이드를 최대한 크게 (검정 여백 최소화)
  // - ui=bottom (TOPIK II): 하단 컨트롤바 공간만 최소 확보
  // - eps: 상단 배지/코너버튼 공간만 최소 확보

  const padding = 4; // 여백 최소

  const reservedBottom = (uiMode === "bottom") ? 54 : 8;
  const reservedTop    = (uiMode === "bottom") ? 8  : 54;

  const maxW = Math.max(200, stage.clientWidth  - padding);
  const maxH = Math.max(
    200,
    stage.clientHeight - padding - reservedBottom - reservedTop
  );

  const s = Math.min(maxW / viewport1.width, maxH / viewport1.height);

  return Math.max(0.1, s);
}

  async function renderPage(num){
    rendering = true;
    setMsg("Loading…");

    const page = await pdfDoc.getPage(num);
    lastPageViewport1 = page.getViewport({ scale: 1 });

    const scale = calcScaleToFit(lastPageViewport1);
    const viewport = page.getViewport({ scale });

    const dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width  = Math.floor(viewport.width  * dpr);
    canvas.height = Math.floor(viewport.height * dpr);
    canvas.style.width  = Math.floor(viewport.width) + "px";
    canvas.style.height = Math.floor(viewport.height) + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    try{
      await page.render({ canvasContext: ctx, viewport }).promise;
      setMsg("");
    }catch(e){
      console.error(e);
      setMsg("Render failed. Check console.");
    }

    setControls();
    rendering = false;

    if(pending !== null){
      const p = pending;
      pending = null;
      renderPage(p);
    }
  }

  function queueRender(num){
    if(rendering) pending = num;
    else renderPage(num);
  }

  function prev(){
    if(!pdfDoc || pageNum <= 1) return;
    pageNum--;
    queueRender(pageNum);
  }

  function next(){
    if(!pdfDoc || pageNum >= pdfDoc.numPages) return;
    pageNum++;
    queueRender(pageNum);
  }

  // click bindings
  btnPrev.addEventListener("click", ()=>{ if(!btnPrev.classList.contains("disabled")) prev(); });
  btnNext.addEventListener("click", ()=>{ if(!btnNext.classList.contains("disabled")) next(); });

  cPrev.addEventListener("click", ()=>{ if(!cPrev.classList.contains("disabled")) prev(); });
  cNext.addEventListener("click", ()=>{ if(!cNext.classList.contains("disabled")) next(); });

  $("tapLeft").addEventListener("click", prev);
  $("tapRight").addEventListener("click", next);

  window.addEventListener("keydown", (e)=>{
    if(e.key === "ArrowLeft") prev();
    if(e.key === "ArrowRight") next();
  });

  const ro = new ResizeObserver(()=>{
    if(pdfDoc && lastPageViewport1){
      queueRender(pageNum);
    }
  });
  ro.observe(stage);

  async function loadPdf(url){
    if(!url){
      setMsg("No PDF URL.\nOpen with ?file=ENCODED_PDF_URL");
      setControls();
      return;
    }
    setMsg("Loading…");
    try{
      const task = pdfjsLib.getDocument({ url });
      pdfDoc = await task.promise;
      pageNum = 1;
      setControls();
      queueRender(pageNum);
    }catch(e){
      console.error(e);
      setMsg("PDF load failed. Check console.");
      setControls();
    }
  }

  // init
  const p = getParams();
  applyUIMode(p.ui);          // default eps, if ui=bottom -> topik2
  loadPdf(p.file);
</script>
</body>
</html>
