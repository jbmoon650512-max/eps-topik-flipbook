<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JB Flipbook Viewer</title>

  <!-- pdf.js (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.js"></script>

  <style>
    :root{
      --btn: 36px;                 /* ✅ 36px */
      --hud-bg: rgba(15,23,42,.55);
      --hud-fg: rgba(226,232,240,.75); /* ✅ 옅은 회색 */
      --hud-fg-strong: rgba(226,232,240,.9);
    }
    html,body{height:100%; margin:0; background:#000; overflow:hidden;}
    #app{
      position:fixed; inset:0;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* canvas area */
    #stage{
      position:absolute; inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    canvas{
      max-width:100%;
      max-height:100%;
      display:block;
    }

    /* ✅ bottom controls */
    .btn{
      position:absolute;
      width:var(--btn); height:var(--btn);
      border-radius:999px;
      border:0;
      background:rgba(255,255,255,.12);
      color:#fff;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      backdrop-filter: blur(8px);
    }
    .btn:active{transform:scale(.98);}
    .btn[disabled]{opacity:.35; cursor:not-allowed;}

    /* ✅ 좌/우 하단 고정 */
    #prev{ left:14px; bottom:14px; }
    #next{ right:14px; bottom:14px; }

    /* ✅ Prev/Next 텍스트 삭제 = 아이콘만 */
    .btn svg{ width:18px; height:18px; }

    /* ✅ Page x/y 하단 중앙 */
    #pageHud{
      position:absolute;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      padding:6px 10px;
      border-radius:999px;
      background:var(--hud-bg);
      color:var(--hud-fg);
      font: 900 12px/1 system-ui,-apple-system,Segoe UI,Roboto,Pretendard,sans-serif;
      letter-spacing:.02em;
      user-select:none;
      backdrop-filter: blur(8px);
    }

    /* error */
    #err{
      position:absolute;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      color:#fff;
      font: 800 14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Pretendard,sans-serif;
      padding:24px;
      text-align:center;
      background:#000;
    }
    #err small{
      display:block;
      margin-top:10px;
      opacity:.7;
      font-weight:700;
      word-break:break-all;
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="stage"><canvas id="cv"></canvas></div>

    <button id="prev" class="btn" aria-label="Prev">
      <svg viewBox="0 0 24 24" fill="none"><path d="M14.5 5l-7 7 7 7" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div id="pageHud">Page 0 / 0</div>

    <button id="next" class="btn" aria-label="Next">
      <svg viewBox="0 0 24 24" fill="none"><path d="M9.5 5l7 7-7 7" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div id="err">
      <div>
        Slide load failed.
        <small id="errUrl"></small>
      </div>
    </div>
  </div>

  <script>
    // pdf.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.js";

    const qs = new URLSearchParams(location.search);
    const file = qs.get("file") || "";
    const cv = document.getElementById("cv");
    const ctx = cv.getContext("2d", { alpha:false });
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");
    const pageHud = document.getElementById("pageHud");
    const err = document.getElementById("err");
    const errUrl = document.getElementById("errUrl");

    let pdf = null;
    let page = 1;
    let rendering = false;
    let pending = null;

    function showError(url){
      err.style.display = "flex";
      errUrl.textContent = url || "";
      pageHud.textContent = "Page 0 / 0";
      prevBtn.disabled = true;
      nextBtn.disabled = true;
    }

    function setHud(){
      if(!pdf){
        pageHud.textContent = "Page 0 / 0";
        return;
      }
      pageHud.textContent = `Page ${page} / ${pdf.numPages}`;
      prevBtn.disabled = (page <= 1);
      nextBtn.disabled = (page >= pdf.numPages);
    }

    function fitViewport(vp){
      // ✅ “프레임을 꽉 채움”: contain이 아니라 "최대 확대(검은 배경 최소화)" = cover에 가깝게
      // 단, 잘림 방지를 위해 약간 안전 마진을 두고 최대화
      const w = window.innerWidth;
      const h = window.innerHeight;

      const sx = w / vp.width;
      const sy = h / vp.height;

      // maximize while staying inside (contain) but 98%까지 꽉
      const scale = Math.min(sx, sy) * 0.98;

      return scale;
    }

    async function render(){
      if(!pdf) return;
      if(rendering){ pending = page; return; }
      rendering = true;

      try{
        const p = await pdf.getPage(page);
        const base = p.getViewport({ scale: 1 });

        const scale = fitViewport(base);
        const vp = p.getViewport({ scale });

        const dpr = Math.max(1, window.devicePixelRatio || 1);

        cv.width  = Math.floor(vp.width  * dpr);
        cv.height = Math.floor(vp.height * dpr);
        cv.style.width  = Math.floor(vp.width) + "px";
        cv.style.height = Math.floor(vp.height) + "px";

        const t = ctx.getTransform();
        if(t.a !== 1 || t.d !== 1) ctx.setTransform(1,0,0,1,0,0);
        ctx.scale(dpr, dpr);

        ctx.fillStyle = "#000";
        ctx.fillRect(0,0, vp.width, vp.height);

        await p.render({ canvasContext: ctx, viewport: vp }).promise;
        setHud();
      } catch(e){
        showError(file);
      } finally {
        rendering = false;
        if(pending !== null){
          const next = pending;
          pending = null;
          page = next;
          render();
        }
      }
    }

    function clampPage(n){
      if(!pdf) return 1;
      return Math.max(1, Math.min(pdf.numPages, n));
    }

    prevBtn.addEventListener("click", ()=>{
      if(!pdf) return;
      page = clampPage(page - 1);
      render();
    });
    nextBtn.addEventListener("click", ()=>{
      if(!pdf) return;
      page = clampPage(page + 1);
      render();
    });

    // ✅ resize 안정화 (TOPIK II Tools 열림/닫힘 포함)
    let rAF = null;
    function onResize(){
      if(!pdf) return;
      if(rAF) cancelAnimationFrame(rAF);
      rAF = requestAnimationFrame(()=>render());
    }
    window.addEventListener("resize", onResize);

    // ✅ 부모(WP)에서 postMessage로 재스케일 트리거
    window.addEventListener("message", (ev)=>{
      if(!ev || !ev.data) return;
      if(ev.data.type === "JB_VIEWER_RESIZE"){
        onResize();
      }
    });

    // load
    (async function(){
      if(!file){ showError(""); return; }
      try{
        pdf = await pdfjsLib.getDocument({ url: file }).promise;
        err.style.display = "none";
        page = 1;
        setHud();
        render();
      } catch(e){
        showError(file);
      }
    })();
  </script>
</body>
</html>
