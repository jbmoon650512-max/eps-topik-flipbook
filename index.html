<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JB Flipbook Viewer</title>

  <!-- PDF.js (CDN 고정) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.js"></script>
  <style>
    :root{
      --bg:#0b1220;
      --panel:#0f172a;
      --btn:36px;
      --btnBg:rgba(255,255,255,.10);
      --btnBgHover:rgba(255,255,255,.18);
      --btnStroke:rgba(255,255,255,.18);
      --pillBg:rgba(255,255,255,.12);
      --pillText:rgba(255,255,255,.55);
      --shadow:0 10px 28px rgba(0,0,0,.28);
      --radius:14px;
    }
    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      overflow:hidden;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Pretendard,sans-serif;
    }
    /* iframe 안에서 “검은 배경이 프레임”처럼 보이도록: 전체를 어둡게 깔고, 중앙 캔버스만 띄움 */
    .stage{
      position:fixed; inset:0;
      background:var(--bg);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .frame{
      position:relative;
      width:100%;
      height:100%;
      max-width:100vw;
      max-height:100vh;
      padding:0;
      box-sizing:border-box;
    }

    /* 캔버스 영역: 가능한 크게(여백 최소) */
    .canvas-wrap{
      position:absolute; inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:8px;                /* 최소 패딩 */
      box-sizing:border-box;
    }
    canvas{
      display:block;
      border-radius:12px;
      box-shadow:var(--shadow);
      background:#fff;
      max-width:100%;
      max-height:100%;
    }

    /* 컨트롤: 하단 좌/우 + 중앙 페이지 */
    .btn{
      position:absolute;
      bottom:12px;
      width:var(--btn);
      height:var(--btn);
      border-radius:999px;
      border:1px solid var(--btnStroke);
      background:var(--btnBg);
      backdrop-filter:blur(6px);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
      transition:.15s ease;
    }
    .btn:hover{ background:var(--btnBgHover); transform:translateY(-1px); }
    .btn:active{ transform:translateY(0); }
    .btn[disabled]{
      opacity:.25;
      cursor:not-allowed;
      transform:none;
    }
    .btn.prev{ left:12px; }
    .btn.next{ right:12px; }

    .btn svg{
      width:18px; height:18px;
      fill:none;
      stroke:rgba(255,255,255,.85);
      stroke-width:2.6;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .page-pill{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      bottom:14px;
      padding:6px 10px;
      border-radius:999px;
      background:var(--pillBg);
      color:var(--pillText);
      font-weight:800;
      font-size:12px;
      letter-spacing:.02em;
      user-select:none;
      backdrop-filter:blur(6px);
      border:1px solid rgba(255,255,255,.10);
    }

    .toast{
      position:absolute;
      top:10px;
      left:50%;
      transform:translateX(-50%);
      padding:8px 10px;
      border-radius:10px;
      background:rgba(255,255,255,.10);
      color:rgba(255,255,255,.80);
      font-size:12px;
      font-weight:800;
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter:blur(6px);
      display:none;
      max-width:min(680px, calc(100vw - 24px));
      text-align:center;
    }
    .toast.show{ display:block; }

    /* 모바일에서 버튼/페이지 살짝 올리기 */
    @media (max-width:520px){
      .btn{ bottom:10px; }
      .page-pill{ bottom:12px; }
      .canvas-wrap{ padding:6px; }
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="frame" id="frame">
      <div class="canvas-wrap" id="wrap">
        <canvas id="pdfCanvas"></canvas>
      </div>

      <button class="btn prev" id="prevBtn" aria-label="Previous page">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>

      <button class="btn next" id="nextBtn" aria-label="Next page">
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </button>

      <div class="page-pill" id="pagePill">Page 0 / 0</div>
      <div class="toast" id="toast"></div>
    </div>
  </div>

  <script>
    // ---------------------------
    // Utils
    // ---------------------------
    const $ = (id)=>document.getElementById(id);
    const canvas = $("pdfCanvas");
    const ctx = canvas.getContext("2d", { alpha:false });
    const prevBtn = $("prevBtn");
    const nextBtn = $("nextBtn");
    const pagePill = $("pagePill");
    const toast = $("toast");
    const wrap = $("wrap");

    function showToast(msg){
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(()=>toast.classList.remove("show"), 2800);
    }

    function getParam(name){
      const url = new URL(location.href);
      return url.searchParams.get(name) || "";
    }

    function clamp(n,min,max){ return Math.max(min, Math.min(max,n)); }

    // ---------------------------
    // PDF.js setup (worker CDN 고정)
    // ---------------------------
    (function ensurePdfjs(){
      if(!window.pdfjsLib){
        showToast("PDF engine load failed (pdfjsLib missing).");
        throw new Error("pdfjsLib missing");
      }
      // cdnjs 경로에 맞춘 worker
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.js";
    })();

    // ---------------------------
    // State
    // ---------------------------
    const state = {
      file: "",
      pdf: null,
      page: 1,
      pageCount: 0,
      rendering: false,
      pending: false,
      lastBox: { w:0, h:0 },
      lastRenderKey: ""
    };

    // ---------------------------
    // Render logic (프레임 꽉 채우기 + 리사이즈 안정화)
    // ---------------------------
    function getBox(){
      const r = wrap.getBoundingClientRect();
      // 아주 작은 흔들림 방지: 소수점 제거
      const w = Math.max(1, Math.floor(r.width));
      const h = Math.max(1, Math.floor(r.height));
      return { w, h };
    }

    async function render(){
      if(!state.pdf) return;
      if(state.rendering){
        state.pending = true;
        return;
      }
      state.rendering = true;

      try{
        const { w, h } = getBox();
        state.lastBox = { w, h };

        const page = await state.pdf.getPage(state.page);

        // “프레임을 꽉 채우는” 스케일 계산
        const v0 = page.getViewport({ scale: 1 });
        const scale = Math.min((w / v0.width), (h / v0.height));
        const v = page.getViewport({ scale });

        // 렌더 키: 같은 크기/페이지면 재렌더 최소화
        const key = `${state.page}|${w}x${h}|${Math.round(scale*1000)}`;
        if(key === state.lastRenderKey){
          state.rendering = false;
          if(state.pending){ state.pending=false; requestAnimationFrame(render); }
          return;
        }
        state.lastRenderKey = key;

        const dpr = Math.max(1, window.devicePixelRatio || 1);

        canvas.width  = Math.floor(v.width  * dpr);
        canvas.height = Math.floor(v.height * dpr);
        canvas.style.width  = Math.floor(v.width) + "px";
        canvas.style.height = Math.floor(v.height) + "px";

        const transform = (dpr !== 1) ? [dpr,0,0,dpr,0,0] : null;

        ctx.setTransform(1,0,0,1,0,0);
        ctx.clearRect(0,0,canvas.width,canvas.height);

        await page.render({
          canvasContext: ctx,
          viewport: v,
          transform
        }).promise;

        pagePill.textContent = `Page ${state.page} / ${state.pageCount}`;
        prevBtn.disabled = (state.page <= 1);
        nextBtn.disabled = (state.page >= state.pageCount);

      } catch(err){
        console.error(err);
        pagePill.textContent = "Page 0 / 0";
        showToast("Render failed. Check PDF URL / CORS / file exists.");
      } finally{
        state.rendering = false;
        if(state.pending){
          state.pending = false;
          requestAnimationFrame(render);
        }
      }
    }

    function go(delta){
      if(!state.pdf) return;
      state.page = clamp(state.page + delta, 1, state.pageCount || 1);
      render();
    }

    prevBtn.addEventListener("click", ()=>go(-1));
    nextBtn.addEventListener("click", ()=>go(1));

    // 키보드 지원(옵션)
    window.addEventListener("keydown", (e)=>{
      if(e.key === "ArrowLeft") go(-1);
      if(e.key === "ArrowRight") go(1);
    });

    // ---------------------------
    // Resize 안정화: Tools 토글/탭 전환/iframe 리사이즈 대응
    // ---------------------------
    let resizeRAF = null;
    function scheduleRender(){
      if(resizeRAF) cancelAnimationFrame(resizeRAF);
      resizeRAF = requestAnimationFrame(()=>{ resizeRAF=null; render(); });
    }

    const ro = new ResizeObserver(()=>scheduleRender());
    ro.observe(wrap);

    document.addEventListener("visibilitychange", ()=>{
      if(!document.hidden) scheduleRender();
    });

    // WordPress 쪽에서 postMessage로 리렌더 트리거 가능
    // parent가 iframe.contentWindow.postMessage({type:'JB_VIEWER_RESIZE'}, '*') 보내면 즉시 재렌더
    window.addEventListener("message", (ev)=>{
      const d = ev.data || {};
      if(d && d.type === "JB_VIEWER_RESIZE") scheduleRender();
      if(d && d.type === "JB_VIEWER_GOTO" && Number.isFinite(d.page)){
        state.page = clamp(parseInt(d.page,10), 1, state.pageCount || 1);
        scheduleRender();
      }
    });

    // ---------------------------
    // Boot
    // ---------------------------
    async function boot(){
      const file = getParam("file");
      state.file = file;

      if(!file){
        pagePill.textContent = "Page 0 / 0";
        showToast("No file param. Use ?file=PDF_URL");
        return;
      }

      try{
        showToast("Loading PDF...");
        const task = window.pdfjsLib.getDocument({
          url: file,
          withCredentials: false
        });

        state.pdf = await task.promise;
        state.pageCount = state.pdf.numPages || 0;
        state.page = 1;

        showToast("Ready.");
        render();

      } catch(err){
        console.error(err);
        state.pdf = null;
        state.pageCount = 0;
        pagePill.textContent = "Page 0 / 0";
        showToast("PDF load failed. Verify URL opens directly.");
      }
    }

    boot();
  </script>
</body>
</html>
