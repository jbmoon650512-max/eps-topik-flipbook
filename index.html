<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EPS / TOPIK II Flipbook Viewer</title>

  <style>
    html,body{
      height:100%; margin:0;
      background:#0b0f17; color:#e8eefc;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Pretendard,sans-serif;
    }
    .wrap{height:100%;width:100%;display:flex;flex-direction:column;overflow:hidden;}
    .stage{
      flex:1; position:relative;
      display:flex; align-items:center; justify-content:center;
      overflow:hidden; background:#0b0f17;
    }

    /* ✅ 캔버스: 가능한 최대 크기 */
    canvas{
      display:block;
      max-width:100%;
      max-height:100%;
      border-radius:18px;
      background:#0f1624;
      box-shadow:0 12px 30px rgba(0,0,0,.46);
    }

/* =========================
   UI MODE B: EPS (CORNER BUTTONS)
   - 콘텐츠 가림 최소화: 상단 모서리
   - ✅ 흰 배경 슬라이드에서도 항상 보이게: "파란 버튼 + 흰 화살표"
   ========================= */
.cornerNav{
  position:absolute;
  top:12px; left:12px; right:12px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  z-index:9;
  pointer-events:none; /* 버튼만 클릭되게 */
}

.cornerBtn{
  pointer-events:auto;

  width:44px;
  height:44px;
  border-radius:999px;

  display:flex;
  align-items:center;
  justify-content:center;

  /* ✅ 핵심: 어떤 배경에서도 보이는 "블루 솔리드" */
  background:rgba(37,99,235,.92);           /* blue */
  border:1px solid rgba(255,255,255,.55);  /* 밝은 테두리 */
  color:#ffffff;                            /* 화살표 흰색 */

  font-size:22px;
  font-weight:1000;

  /* ✅ 흰 바탕에서 떠 보이게 */
  box-shadow:
    0 10px 18px rgba(0,0,0,.22),
    0 0 0 2px rgba(15,23,42,.18);          /* 얇은 외곽 링 */

  opacity:1;
  cursor:pointer;
  user-select:none;

  transition: transform .12s ease, filter .12s ease, opacity .12s ease;
}

.cornerBtn:hover{
  filter:brightness(1.08);
}

.cornerBtn:active{
  transform:scale(.96);
  filter:brightness(1.12);
}

.cornerBtn.disabled{
  opacity:.35;
  cursor:not-allowed;
  filter:grayscale(.25);
}

    /* ✅ 중앙 페이지 배지 (상단) */
    .pageBadge{
      position:absolute; top:12px; left:50%; transform:translateX(-50%);
      padding:6px 12px; border-radius:999px;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.30);
      font-size:12px; font-weight:950;
      color:#fff;
      z-index:19;
      user-select:none;
      backdrop-filter: blur(10px);
      box-shadow:0 12px 26px rgba(0,0,0,.28);
    }

    /* ✅ 좌/우 탭존(공통) — 버튼이 작아도 넘김 가능 */
    .tapZone{
      position:absolute; top:0; bottom:0; width:22%;
      cursor:pointer; user-select:none; z-index:10;
    }
    .tapLeft{left:0;}
    .tapRight{right:0;}

    /* 로딩/에러 */
    .msg{
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      font-size:13px; opacity:.85; text-align:center; padding:16px;
      z-index:5;
    }
  </style>

  <!-- pdf.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body>
<div class="wrap">
  <div class="stage" id="stage">

    <!-- TOP CORNER NAV (공통) -->
    <div class="cornerNav" id="cornerNav" aria-label="Corner navigation">
      <div class="cornerBtn" id="cPrev" aria-label="Previous page">‹</div>
      <div class="cornerBtn" id="cNext" aria-label="Next page">›</div>
    </div>
    <div class="pageBadge" id="pageBadge">Page - / -</div>

    <!-- common -->
    <div class="tapZone tapLeft" id="tapLeft" aria-label="Previous page"></div>
    <canvas id="c"></canvas>
    <div class="tapZone tapRight" id="tapRight" aria-label="Next page"></div>

    <div class="msg" id="msg">Loading…</div>
  </div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const $ = (id)=>document.getElementById(id);
  const canvas = $("c");
  const ctx = canvas.getContext("2d", { alpha: false });
  const stage = $("stage");
  const msg = $("msg");

  const cPrev = $("cPrev");
  const cNext = $("cNext");
  const badge = $("pageBadge");

  let pdfDoc = null;
  let pageNum = 1;
  let rendering = false;
  let pending = null;
  let lastPageViewport1 = null;

  function getFileFromQuery(){
    const u = new URL(location.href);
    return u.searchParams.get("file") || "";
  }

  function setMsg(t){
    msg.style.display = t ? "flex" : "none";
    msg.textContent = t || "";
  }

  function setControls(){
    if(!pdfDoc){
      badge.textContent = "Page - / -";
      cPrev.classList.add("disabled");
      cNext.classList.add("disabled");
      return;
    }

    badge.textContent = `Page ${pageNum} / ${pdfDoc.numPages}`;
    const atFirst = pageNum <= 1;
    const atLast  = pageNum >= pdfDoc.numPages;
    cPrev.classList.toggle("disabled", atFirst);
    cNext.classList.toggle("disabled", atLast);
  }

  /* ✅ 핵심: EPS/TOPIK2 모두 슬라이드 최대 확대 */
 function calcScaleToFit(viewport1){
  // ✅ 목표: 검은 배경(여백) 거의 안 보이게 "최대 확대"
  // - reservedTop/Bottom을 최소화
  // - scale을 살짝 더 키워서(BOOST) 여백을 먹어버림(필요시 약간 크롭)

  const padding = 0;          // 여백 제거
  const reservedTop = 38;     // 상단 페이지배지/버튼 영역 최소치
  const reservedBottom = 0;   // 하단 여백 제거

  const maxW = Math.max(200, stage.clientWidth - padding);
  const maxH = Math.max(200, stage.clientHeight - padding - reservedTop - reservedBottom);

  let s = Math.min(maxW / viewport1.width, maxH / viewport1.height);

  // ✅ 핵심: 여백을 줄이기 위해 의도적으로 더 확대
  const BOOST = 1.12;         // 1.08~1.15 사이에서 조절 가능
  s = s * BOOST;

  return Math.max(0.1, s);
}

  async function renderPage(num){
    rendering = true;
    setMsg("Loading…");

    const page = await pdfDoc.getPage(num);
    lastPageViewport1 = page.getViewport({ scale: 1 });

    const scale = calcScaleToFit(lastPageViewport1);
    const viewport = page.getViewport({ scale });

    const dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width  = Math.floor(viewport.width  * dpr);
    canvas.height = Math.floor(viewport.height * dpr);
    canvas.style.width  = Math.floor(viewport.width) + "px";
    canvas.style.height = Math.floor(viewport.height) + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    try{
      await page.render({ canvasContext: ctx, viewport }).promise;
      setMsg("");
    }catch(e){
      console.error(e);
      setMsg("Render failed. Check console.");
    }

    setControls();
    rendering = false;

    if(pending !== null){
      const p = pending;
      pending = null;
      renderPage(p);
    }
  }

  function queueRender(num){
    if(rendering) pending = num;
    else renderPage(num);
  }

  function prev(){
    if(!pdfDoc || pageNum <= 1) return;
    pageNum--;
    queueRender(pageNum);
  }

  function next(){
    if(!pdfDoc || pageNum >= pdfDoc.numPages) return;
    pageNum++;
    queueRender(pageNum);
  }

  // click bindings
  cPrev.addEventListener("click", ()=>{ if(!cPrev.classList.contains("disabled")) prev(); });
  cNext.addEventListener("click", ()=>{ if(!cNext.classList.contains("disabled")) next(); });

  $("tapLeft").addEventListener("click", prev);
  $("tapRight").addEventListener("click", next);

  // keyboard support
  window.addEventListener("keydown", (e)=>{
    if(e.key === "ArrowLeft") prev();
    if(e.key === "ArrowRight") next();
  });

  // resize 대응
  const ro = new ResizeObserver(()=>{
    if(pdfDoc && lastPageViewport1){
      queueRender(pageNum);
    }
  });
  ro.observe(stage);

  async function loadPdf(url){
    if(!url){
      setMsg("No PDF URL.\nOpen with ?file=ENCODED_PDF_URL");
      setControls();
      return;
    }
    setMsg("Loading…");
    try{
      const task = pdfjsLib.getDocument({ url });
      pdfDoc = await task.promise;
      pageNum = 1;
      setControls();
      queueRender(pageNum);
    }catch(e){
      console.error(e);
      setMsg("PDF load failed. Check console.");
      setControls();
    }
  }

  // init
  const initial = getFileFromQuery();
  loadPdf(initial);
</script>
</body>
</html>
