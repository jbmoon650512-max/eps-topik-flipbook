<script>
  // --- FILE PARAM NORMALIZER (PASTE THIS NEAR THE TOP OF YOUR SCRIPT) ---
  const params = new URLSearchParams(location.search);
  let file = params.get("file") || "";

  // 1) If user passed a full URL that points to THIS site, convert to relative path.
  //    Example:
  //    https://jbmoon650512-max.github.io/eps-topik-flipbook/pdf/eps/u01/ph.pdf
  //    -> pdf/eps/u01/ph.pdf
  if (file.startsWith("http")) {
    try {
      const u = new URL(file);
      // If same origin + same repo base path, strip it to relative.
      const base = location.origin + location.pathname.replace(/\/index\.html?$/, "/");
      if (file.startsWith(base)) file = file.slice(base.length);
      // If same origin but different path, still strip origin.
      if (u.origin === location.origin && file.startsWith(location.origin)) {
        file = file.replace(location.origin, "");
        file = file.replace(/^\/+/, "");
      }
    } catch (e) {}
  }

  // 2) Hard block cross-origin PDFs (prevents white box / silent failure)
  if (file.startsWith("http")) {
    document.body.innerHTML = "<div style='color:#fff;font:16px/1.6 system-ui;padding:24px;'>PDF must be loaded via a relative path like <b>pdf/eps/u01/ph.pdf</b>.</div>";
    throw new Error("Cross-origin PDF blocked. Use relative path.");
  }

  // 3) Ensure no leading slash (keeps it relative to repo base)
  file = file.replace(/^\/+/, "");

  // Expose as global for the rest of your viewer code
  window.__PDF_FILE__ = file;
</script>
