<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EPS / TOPIK II Flipbook Viewer</title>

  <style>
    html,body{
      height:100%; margin:0;
      background:#0b0f17; color:#e8eefc;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Pretendard,sans-serif;
    }
    .wrap{height:100%;width:100%;display:flex;flex-direction:column;overflow:hidden;}
    .stage{
      flex:1; position:relative;
      display:flex; align-items:center; justify-content:center;
      overflow:hidden; background:#0b0f17;
    }

    /* ✅ 캔버스: 가능한 최대 크기 */
    canvas{
      display:block;
      max-width:100%;
      max-height:100%;
      border-radius:18px;
      background:#0f1624;
      box-shadow:0 12px 30px rgba(0,0,0,.46);
    }

    /* =========================
       TOP CORNER NAV (EPS/TOPIK2 공통)
       - 검정 배경에서도 확실히 보이게 "밝게 + 두껍게"
       - 콘텐츠 가림 최소화를 위해 상단 모서리 고정
       ========================= */
    .cornerNav{
      position:absolute; top:10px; left:10px; right:10px;
      display:flex; justify-content:space-between; align-items:flex-start;
      z-index:20; pointer-events:none;
    }
    .cornerBtn{
      pointer-events:auto;
      width:48px; height:48px; border-radius:999px;
      display:flex; align-items:center; justify-content:center;
      background:rgba(255,255,255,.22);
      border:1px solid rgba(255,255,255,.40);
      color:#ffffff;
      font-size:26px; font-weight:1000;
      cursor:pointer; user-select:none;
      backdrop-filter: blur(10px);
      box-shadow:0 12px 26px rgba(0,0,0,.34);
      opacity:.95;
      transition: transform .12s ease, opacity .12s ease, background .12s ease;
    }
    .cornerBtn:hover{ background:rgba(255,255,255,.28); opacity:1; }
    .cornerBtn:active{ transform:scale(.96); }
    .cornerBtn.disabled{ opacity:.25; cursor:not-allowed; }

    /* ✅ 중앙 페이지 배지 (상단) */
    .pageBadge{
      position:absolute; top:12px; left:50%; transform:translateX(-50%);
      padding:6px 12px; border-radius:999px;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.30);
      font-size:12px; font-weight:950;
      color:#fff;
      z-index:19;
      user-select:none;
      backdrop-filter: blur(10px);
      box-shadow:0 12px 26px rgba(0,0,0,.28);
    }

    /* ✅ 좌/우 탭존(공통) — 버튼이 작아도 넘김 가능 */
    .tapZone{
      position:absolute; top:0; bottom:0; width:22%;
      cursor:pointer; user-select:none; z-index:10;
    }
    .tapLeft{left:0;}
    .tapRight{right:0;}

    /* 로딩/에러 */
    .msg{
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      font-size:13px; opacity:.85; text-align:center; padding:16px;
      z-index:5;
    }
  </style>

  <!-- pdf.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body>
<div class="wrap">
  <div class="stage" id="stage">

    <!-- TOP CORNER NAV (공통) -->
    <div class="cornerNav" id="cornerNav" aria-label="Corner navigation">
      <div class="cornerBtn" id="cPrev" aria-label="Previous page">‹</div>
      <div class="cornerBtn" id="cNext" aria-label="Next page">›</div>
    </div>
    <div class="pageBadge" id="pageBadge">Page - / -</div>

    <!-- common -->
    <div class="tapZone tapLeft" id="tapLeft" aria-label="Previous page"></div>
    <canvas id="c"></canvas>
    <div class="tapZone tapRight" id="tapRight" aria-label="Next page"></div>

    <div class="msg" id="msg">Loading…</div>
  </div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const $ = (id)=>document.getElementById(id);
  const canvas = $("c");
  const ctx = canvas.getContext("2d", { alpha: false });
  const stage = $("stage");
  const msg = $("msg");

  const cPrev = $("cPrev");
  const cNext = $("cNext");
  const badge = $("pageBadge");

  let pdfDoc = null;
  let pageNum = 1;
  let rendering = false;
  let pending = null;
  let lastPageViewport1 = null;

  function getFileFromQuery(){
    const u = new URL(location.href);
    return u.searchParams.get("file") || "";
  }

  function setMsg(t){
    msg.style.display = t ? "flex" : "none";
    msg.textContent = t || "";
  }

  function setControls(){
    if(!pdfDoc){
      badge.textContent = "Page - / -";
      cPrev.classList.add("disabled");
      cNext.classList.add("disabled");
      return;
    }

    badge.textContent = `Page ${pageNum} / ${pdfDoc.numPages}`;
    const atFirst = pageNum <= 1;
    const atLast  = pageNum >= pdfDoc.numPages;
    cPrev.classList.toggle("disabled", atFirst);
    cNext.classList.toggle("disabled", atLast);
  }

  /* ✅ 핵심: EPS/TOPIK2 모두 슬라이드 최대 확대 */
  function calcScaleToFit(viewport1){
    const padding = 0;            // ✅ 여백 최소
    const reservedTop = 68;       // ✅ 상단 버튼+배지 공간만 확보
    const reservedBottom = 6;     // ✅ 거의 없음

    const maxW = Math.max(200, stage.clientWidth - padding);
    const maxH = Math.max(200, stage.clientHeight - padding - reservedTop - reservedBottom);

    const s = Math.min(maxW / viewport1.width, maxH / viewport1.height);
    return Math.max(0.1, s);
  }

  async function renderPage(num){
    rendering = true;
    setMsg("Loading…");

    const page = await pdfDoc.getPage(num);
    lastPageViewport1 = page.getViewport({ scale: 1 });

    const scale = calcScaleToFit(lastPageViewport1);
    const viewport = page.getViewport({ scale });

    const dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width  = Math.floor(viewport.width  * dpr);
    canvas.height = Math.floor(viewport.height * dpr);
    canvas.style.width  = Math.floor(viewport.width) + "px";
    canvas.style.height = Math.floor(viewport.height) + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    try{
      await page.render({ canvasContext: ctx, viewport }).promise;
      setMsg("");
    }catch(e){
      console.error(e);
      setMsg("Render failed. Check console.");
    }

    setControls();
    rendering = false;

    if(pending !== null){
      const p = pending;
      pending = null;
      renderPage(p);
    }
  }

  function queueRender(num){
    if(rendering) pending = num;
    else renderPage(num);
  }

  function prev(){
    if(!pdfDoc || pageNum <= 1) return;
    pageNum--;
    queueRender(pageNum);
  }

  function next(){
    if(!pdfDoc || pageNum >= pdfDoc.numPages) return;
    pageNum++;
    queueRender(pageNum);
  }

  // click bindings
  cPrev.addEventListener("click", ()=>{ if(!cPrev.classList.contains("disabled")) prev(); });
  cNext.addEventListener("click", ()=>{ if(!cNext.classList.contains("disabled")) next(); });

  $("tapLeft").addEventListener("click", prev);
  $("tapRight").addEventListener("click", next);

  // keyboard support
  window.addEventListener("keydown", (e)=>{
    if(e.key === "ArrowLeft") prev();
    if(e.key === "ArrowRight") next();
  });

  // resize 대응
  const ro = new ResizeObserver(()=>{
    if(pdfDoc && lastPageViewport1){
      queueRender(pageNum);
    }
  });
  ro.observe(stage);

  async function loadPdf(url){
    if(!url){
      setMsg("No PDF URL.\nOpen with ?file=ENCODED_PDF_URL");
      setControls();
      return;
    }
    setMsg("Loading…");
    try{
      const task = pdfjsLib.getDocument({ url });
      pdfDoc = await task.promise;
      pageNum = 1;
      setControls();
      queueRender(pageNum);
    }catch(e){
      console.error(e);
      setMsg("PDF load failed. Check console.");
      setControls();
    }
  }

  // init
  const initial = getFileFromQuery();
  loadPdf(initial);
</script>
</body>
</html>
