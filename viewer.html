<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>EPS-TOPIK Secure Viewer</title>
    <script src="js/jquery.min.js"></script>
    <script src="js/pdf.min.js"></script>
    <script src="js/3dflipbook.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #2d3436; }
        #viewer-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="viewer-container"></div>
    <script>
        const params = new URLSearchParams(window.location.search);
        let file = params.get('file');

        if (file) {
            // 지침 11번 준수: 모든 파일/폴더 경로를 소문자로 변환하여 인식 
            const cleanPath = file.toLowerCase();

            $('#viewer-container').FlipBook({
                pdf: cleanPath,
                template: {
                    html: 'templates/default-book-view.html',
                    styles: ['css/short-white-book-view.css'],
                    links: [{ rel: 'stylesheet', href: 'css/font-awesome.min.css' }]
                },
                controlsProps: {
                    downloadURL: false, // 지침 7번: 다운로드 버튼 제거 
                    printURL: false     // 인쇄 방지
                }
            });
        } else {
            document.body.innerHTML = '<h2 style="color:white; text-align:center; margin-top:20%;">파일 경로가 지정되지 않았습니다.</h2>';
        }
    </script>
</body>
</html>
