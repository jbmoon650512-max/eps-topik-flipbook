<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Viewer Redirect</title>
  <script>
    // Keep legacy URLs working:
    // viewer.html?unit=u01&lang=ph  -> index.html?unit=u01&lang=ph
    // viewer.html?file=PDF_URL      -> index.html?file=PDF_URL
    (function () {
      const u = new URL(location.href);
      u.pathname = u.pathname.replace(/viewer\.html$/i, "index.html");
      location.replace(u.toString());
    })();
  </script>
</head>
<body></body>
</html>
