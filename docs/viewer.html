<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EPS-TOPIK Slide Viewer</title>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    /* ====== ABSOLUTE: no scrollbars anywhere ====== */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden !important;     /* remove right/bottom scrollbars */
      overscroll-behavior: none;
      background: #0b1220;
      touch-action: manipulation;
    }

    * { box-sizing: border-box; }

    /* ====== Top controls ====== */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0 12px;
      background: rgba(15, 23, 42, 0.92);
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      z-index: 50;
      user-select: none;
    }

    .btn {
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      color: #fff;
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: transform .12s ease, background .12s ease, opacity .12s ease;
      line-height: 1;
    }
    .btn:hover { background: rgba(255,255,255,0.12); }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: .35; cursor: not-allowed; }

    #pageInfo {
      min-width: 90px;
      text-align: center;
      color: rgba(255,255,255,0.9);
      font-weight: 900;
      letter-spacing: 0.2px;
    }

    /* ====== Viewer area (always fits, never scrolls) ====== */
    #stage {
      position: fixed;
      top: 56px; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden !important;    /* no scrollbars */
      background: radial-gradient(1000px 600px at 50% 20%, rgba(255,255,255,0.08), rgba(0,0,0,0));
    }

    /* Canvas wrapper to keep edges clean */
    #canvasWrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden !important;    /* no scrollbars */
      padding: 12px;                  /* safe margin */
    }

    canvas {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
      background: #111827;
      display: block;
    }

    /* Click/tap zones for page turning (no visible UI) */
    .tapZone {
      position: absolute;
      top: 0; bottom: 0;
      width: 30%;
      z-index: 10;
      cursor: pointer;
    }
    #tapLeft  { left: 0; }
    #tapRight { right: 0; }

    /* Loader / error */
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      color: rgba(255,255,255,0.9);
      font-weight: 800;
      z-index: 20;
      pointer-events: none;
      text-align: center;
      padding: 16px;
    }
    #overlay small { font-weight: 700; color: rgba(255,255,255,0.65); }

    /* Mobile: slightly smaller top bar */
    @media (max-width: 768px) {
      #topbar { height: 52px; }
      #stage { top: 52px; }
      .btn { padding: 9px 12px; border-radius: 11px; font-size: 13px; }
      #pageInfo { min-width: 78px; }
      #canvasWrap { padding: 10px; }
    }
  </style>
</head>

<body>
  <div id="topbar">
    <button id="btnPrev" class="btn" type="button">◀ Prev</button>
    <div id="pageInfo">- / -</div>
    <button id="btnNext" class="btn" type="button">Next ▶</button>
  </div>

  <div id="stage">
    <div id="canvasWrap">
      <div id="tapLeft" class="tapZone" title="Prev"></div>
      <div id="tapRight" class="tapZone" title="Next"></div>

      <canvas id="pdfCanvas"></canvas>

      <div id="overlay">
        <div id="overlayTitle">Loading…</div>
        <small id="overlaySub">Please wait</small>
      </div>
    </div>
  </div>

  <script>
    // ========= PDF.js worker =========
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    // ========= DOM =========
    const canvas = document.getElementById("pdfCanvas");
    const ctx = canvas.getContext("2d", { alpha: false });

    const btnPrev = document.getElementById("btnPrev");
    const btnNext = document.getElementById("btnNext");
    const pageInfo = document.getElementById("pageInfo");

    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlaySub = document.getElementById("overlaySub");

    const tapLeft = document.getElementById("tapLeft");
    const tapRight = document.getElementById("tapRight");

    // ========= State =========
    let pdfDoc = null;
    let pageNum = 1;
    let totalPages = 0;
    let rendering = false;
    let pendingPage = null;

    // ========= Helpers =========
    function qs(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function showOverlay(title, sub) {
      overlay.style.display = "flex";
      overlayTitle.textContent = title || "";
      overlaySub.textContent = sub || "";
    }

    function hideOverlay() {
      overlay.style.display = "none";
    }

    function setNav() {
      btnPrev.disabled = !pdfDoc || pageNum <= 1 || rendering;
      btnNext.disabled = !pdfDoc || pageNum >= totalPages || rendering;
      pageInfo.textContent = pdfDoc ? `${pageNum} / ${totalPages}` : "- / -";
    }

    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    // Fit page to available stage (no scroll)
    function getFitScale(viewport) {
      const topbarH = document.getElementById("topbar").getBoundingClientRect().height;
      const padding = (window.innerWidth <= 768) ? 20 : 24; // matches canvasWrap padding
      const availableW = window.innerWidth - padding;
      const availableH = window.innerHeight - topbarH - padding;

      const scaleX = availableW / viewport.width;
      const scaleY = availableH / viewport.height;

      // fit inside (contain)
      return Math.min(scaleX, scaleY);
    }

    async function renderPage(num) {
      if (!pdfDoc) return;

      rendering = true;
      setNav();
      showOverlay("Rendering…", "");

      const page = await pdfDoc.getPage(num);

      // base viewport at scale 1
      const baseViewport = page.getViewport({ scale: 1 });

      // fit to screen
      const fitScale = getFitScale(baseViewport);
      const viewport = page.getViewport({ scale: fitScale });

      // set canvas size (devicePixelRatio for crispness)
      const dpr = window.devicePixelRatio || 1;

      canvas.width = Math.floor(viewport.width * dpr);
      canvas.height = Math.floor(viewport.height * dpr);

      canvas.style.width = Math.floor(viewport.width) + "px";
      canvas.style.height = Math.floor(viewport.height) + "px";

      // Reset transform for DPR
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = true;

      const renderContext = {
        canvasContext: ctx,
        viewport: viewport
      };

      try {
        await page.render(renderContext).promise;
        hideOverlay();
      } catch (e) {
        showOverlay("Render failed", "PDF could not be rendered.");
        console.error(e);
      } finally {
        rendering = false;
        setNav();

        if (pendingPage !== null) {
          const next = pendingPage;
          pendingPage = null;
          pageNum = clamp(next, 1, totalPages);
          renderPage(pageNum);
        }
      }
    }

    function queueRender(num) {
      if (!pdfDoc) return;
      const target = clamp(num, 1, totalPages);
      if (rendering) {
        pendingPage = target;
      } else {
        pageNum = target;
        renderPage(pageNum);
      }
    }

    function nextPage() { queueRender(pageNum + 1); }
    function prevPage() { queueRender(pageNum - 1); }

    // ========= Events =========
    btnPrev.addEventListener("click", prevPage);
    btnNext.addEventListener("click", nextPage);

    tapLeft.addEventListener("click", prevPage);
    tapRight.addEventListener("click", nextPage);

    // Keyboard arrows
    window.addEventListener("keydown", (e) => {
      if (!pdfDoc) return;
      if (e.key === "ArrowRight" || e.key === "PageDown") nextPage();
      if (e.key === "ArrowLeft" || e.key === "PageUp") prevPage();
    });

    // Resize => re-render current page to fit (no scroll)
    let resizeTimer = null;
    window.addEventListener("resize", () => {
      if (!pdfDoc) return;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        queueRender(pageNum);
      }, 120);
    });

    // Touch swipe (optional, but stable)
    let touchX = null;
    window.addEventListener("touchstart", (e) => {
      if (!e.touches || e.touches.length !== 1) return;
      touchX = e.touches[0].clientX;
    }, { passive: true });

    window.addEventListener("touchend", (e) => {
      if (touchX === null) return;
      const endX = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientX : null;
      if (endX === null) { touchX = null; return; }
      const dx = endX - touchX;
      touchX = null;

      // small threshold to avoid accidental
      if (Math.abs(dx) < 40) return;
      if (dx < 0) nextPage(); else prevPage();
    }, { passive: true });

    // ========= Load PDF =========
    (async function init() {
      const file = qs("file");  // expected: viewer.html?file=<PDF_URL>
      if (!file) {
        showOverlay("No PDF specified", "Use: viewer.html?file=PDF_URL");
        setNav();
        return;
      }

      showOverlay("Loading PDF…", "Preparing pages");

      try {
        // Important: use URL directly (GitHub Pages PDF URL works)
        pdfDoc = await pdfjsLib.getDocument({ url: file }).promise;
        totalPages = pdfDoc.numPages;
        pageNum = 1;
        setNav();
        await renderPage(pageNum);
      } catch (e) {
        console.error(e);
        showOverlay("Load failed", "Check PDF URL (must be public + CORS allowed).");
        setNav();
      }
    })();
  </script>
</body>
</html>
