<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>EPS TOPIK Flip Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #0f172a;
  overflow: hidden; /* 스크롤 차단 */
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

#viewer {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

canvas {
  max-width: 100%;
  max-height: 100%;
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
  background: #fff;
}

/* 컨트롤 바 */
.controls {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
  background: rgba(15,23,42,.85);
  padding: 10px 16px;
  border-radius: 999px;
}

button {
  border: none;
  background: #e11d48;
  color: #fff;
  font-weight: 700;
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.page-indicator {
  color: #e5e7eb;
  font-size: 14px;
  align-self: center;
}
</style>
</head>

<body>
<div id="viewer">
  <canvas id="pdfCanvas"></canvas>

  <div class="controls">
    <button id="prev">◀ Prev</button>
    <div class="page-indicator" id="pageInfo">1 / 1</div>
    <button id="next">Next ▶</button>
  </div>
</div>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const pdfUrl = urlParams.get("file");

if (!pdfUrl) {
  alert("PDF file parameter missing.");
}

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let pdfDoc = null;
let pageNum = 1;
let canvas = document.getElementById("pdfCanvas");
let ctx = canvas.getContext("2d");

function renderPage(num) {
  pdfDoc.getPage(num).then(page => {
    const viewport = page.getViewport({ scale: 1 });
    const scale = Math.min(
      window.innerWidth / viewport.width,
      window.innerHeight / viewport.height
    );
    const scaledViewport = page.getViewport({ scale });

    canvas.width = scaledViewport.width;
    canvas.height = scaledViewport.height;

    page.render({
      canvasContext: ctx,
      viewport: scaledViewport
    });

    document.getElementById("pageInfo").textContent =
      `${pageNum} / ${pdfDoc.numPages}`;

    document.getElementById("prev").disabled = pageNum <= 1;
    document.getElementById("next").disabled = pageNum >= pdfDoc.numPages;
  });
}

pdfjsLib.getDocument(pdfUrl).promise.then(pdf => {
  pdfDoc = pdf;
  renderPage(pageNum);
});

document.getElementById("prev").onclick = () => {
  if (pageNum <= 1) return;
  pageNum--;
  renderPage(pageNum);
};

document.getElementById("next").onclick = () => {
  if (pageNum >= pdfDoc.numPages) return;
  pageNum++;
  renderPage(pageNum);
};

/* 키보드 페이지 넘김 */
window.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") document.getElementById("prev").click();
  if (e.key === "ArrowRight") document.getElementById("next").click();
});

/* 스크롤 완전 차단 */
window.addEventListener("wheel", e => e.preventDefault(), { passive: false });
window.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
</script>
</body>
</html>
