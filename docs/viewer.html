<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EPS-TOPIK Secure Viewer</title>

  <style>
    html,body{height:100%;margin:0;background:#232a33;font-family:system-ui,-apple-system,Segoe UI,Roboto,Pretendard,sans-serif;}
    .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;}
    .stage{
      width:min(1100px, 96vw);
      aspect-ratio:16/9;
      background:#0b1220;
      border-radius:14px;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
      overflow:hidden;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    #msg{font-weight:800;font-size:20px;opacity:.9}
    canvas{max-width:100%;max-height:100%;}
    .ctrl{
      position:absolute;
      bottom:12px; left:0; right:0;
      display:flex; gap:10px;
      justify-content:center; align-items:center;
      pointer-events:auto;
    }
    .btn{
      background:#e11d48;
      border:0;
      color:#fff;
      font-weight:800;
      padding:8px 14px;
      border-radius:999px;
      cursor:pointer;
    }
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .pill{
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.18);
      padding:6px 12px;
      border-radius:999px;
      font-weight:800;
      font-size:13px;
      backdrop-filter: blur(6px);
    }
  </style>

  <!-- pdf.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="stage">
      <div id="msg">No file specified</div>
      <canvas id="cv" style="display:none;"></canvas>

      <div class="ctrl" style="display:none;" id="ctrl">
        <button class="btn" id="prev">◀ Prev</button>
        <div class="pill"><span id="pNow">1</span> / <span id="pAll">1</span></div>
        <button class="btn" id="next">Next ▶</button>
      </div>
    </div>
  </div>

<script>
(async function () {
  const qs = new URLSearchParams(location.search);
  const file = qs.get("file");

  const msg = document.getElementById("msg");
  const canvas = document.getElementById("cv");
  const ctrl = document.getElementById("ctrl");
  const prevBtn = document.getElementById("prev");
  const nextBtn = document.getElementById("next");
  const pNow = document.getElementById("pNow");
  const pAll = document.getElementById("pAll");

  if (!file) return;

  // pdf.js worker
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.js";

  msg.textContent = "Loading...";
  msg.style.display = "block";

  let pdf;
  try {
    pdf = await pdfjsLib.getDocument({ url: file }).promise;
  } catch (e) {
    msg.textContent = "Failed to load PDF";
    return;
  }

  let pageNum = 1;
  const total = pdf.numPages;
  pAll.textContent = String(total);

  msg.style.display = "none";
  canvas.style.display = "block";
  ctrl.style.display = "flex";

  const ctx = canvas.getContext("2d");

  async function render() {
    const page = await pdf.getPage(pageNum);

    // fit page into 16:9 stage
    const stage = document.querySelector(".stage");
    const targetW = stage.clientWidth;
    const targetH = stage.clientHeight;

    const viewport1 = page.getViewport({ scale: 1 });
    const scale = Math.min(targetW / viewport1.width, targetH / viewport1.height);
    const viewport = page.getViewport({ scale });

    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);

    await page.render({ canvasContext: ctx, viewport }).promise;

    pNow.textContent = String(pageNum);
    prevBtn.disabled = pageNum <= 1;
    nextBtn.disabled = pageNum >= total;
  }

  prevBtn.onclick = async () => { if (pageNum > 1) { pageNum--; await render(); } };
  nextBtn.onclick = async () => { if (pageNum < total) { pageNum++; await render(); } };

  // initial
  await render();

  // re-render on resize (debounced)
  let t;
  window.addEventListener("resize", () => {
    clearTimeout(t);
    t = setTimeout(render, 180);
  });
})();
</script>
</body>
</html>
