<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EPS-TOPIK Slide Viewer</title>

  <!-- Prevent scrollbars on both axes -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden; /* 핵심: 스크롤바 제거 */
      background: #0b1220;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Pretendard, sans-serif;
    }

    .app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden; /* 핵심 */
    }

    .topbar {
      flex: 0 0 auto;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0 14px;
      box-sizing: border-box;
      background: rgba(15, 23, 42, 0.92);
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      user-select: none;
    }

    .btn {
      appearance: none;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(2, 6, 23, 0.55);
      color: #e2e8f0;
      font-weight: 800;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      line-height: 1;
      transition: transform .08s ease, background .15s ease, opacity .15s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: .35; cursor: not-allowed; }

    .page-ind {
      min-width: 88px;
      text-align: center;
      font-weight: 900;
      color: #e2e8f0;
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.18);
      padding: 9px 12px;
      border-radius: 999px;
    }

    .stage {
      flex: 1 1 auto;
      position: relative;
      overflow: hidden; /* 핵심 */
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(1200px 600px at 50% 20%, rgba(59,130,246,0.16), transparent 60%),
                  #0b1220;
    }

    .canvas-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden; /* 핵심 */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      box-sizing: border-box;
    }

    /* Canvas is rendered per-page; keep it centered, no scrolling */
    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 14px 38px rgba(0,0,0,0.38);
      background: #ffffff;
    }

    .hint {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      font-weight: 800;
      color: rgba(226, 232, 240, 0.72);
      background: rgba(2, 6, 23, 0.45);
      border: 1px solid rgba(148, 163, 184, 0.14);
      padding: 8px 10px;
      border-radius: 999px;
      pointer-events: none;
      white-space: nowrap;
    }

    .error {
      color: #fecaca;
      font-weight: 900;
      padding: 14px 16px;
      border: 1px solid rgba(248,113,113,0.28);
      background: rgba(127,29,29,0.35);
      border-radius: 14px;
      max-width: 920px;
      margin: 16px;
      line-height: 1.4;
    }
    .error code {
      color: #fde68a;
      font-weight: 900;
      word-break: break-all;
    }
  </style>

  <!-- PDF.js (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.js"></script>
</head>

<body>
  <div class="app">
    <div class="topbar">
      <button class="btn" id="btnPrev">◀ Prev</button>
      <div class="page-ind" id="pageInd">- / -</div>
      <button class="btn" id="btnNext">Next ▶</button>
    </div>

    <div class="stage">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="pdfCanvas"></canvas>
      </div>
      <div class="hint">Download Protected · Page-Turn Mode (No Scroll)</div>
    </div>
  </div>

  <script>
    // =========================
    // CONFIG
    // =========================
    // If 'file' param exists, use it.
    // Else build from unit/lang:
    //   /pdf/eps/u01/ph.pdf
    const DEFAULT_PDF_BASE = "https://jbmoon650512-max.github.io/eps-topik-flipbook/pdf/eps/";

    // pdf.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.js";

    function qs(name) {
      const u = new URL(location.href);
      return u.searchParams.get(name);
    }

    function buildPdfUrl() {
      const file = qs("file");
      if (file) return file;

      const unit = (qs("unit") || "").trim(); // e.g. u01
      const lang = (qs("lang") || "").trim(); // e.g. ph
      if (unit && lang) return `${DEFAULT_PDF_BASE}${unit}/${lang}.pdf`;

      return "";
    }

    const pdfUrl = buildPdfUrl();

    const btnPrev = document.getElementById("btnPrev");
    const btnNext = document.getElementById("btnNext");
    const pageInd = document.getElementById("pageInd");
    const canvas = document.getElementById("pdfCanvas");
    const wrap = document.getElementById("canvasWrap");
    const ctx = canvas.getContext("2d", { alpha: false });

    let pdfDoc = null;
    let pageNum = 1;
    let pageCount = 0;
    let rendering = false;
    let pendingPage = null;

    // =========================
    // Rendering: fit page into available viewport (no scroll)
    // =========================
    async function renderPage(num) {
      if (!pdfDoc) return;

      rendering = true;
      btnPrev.disabled = true;
      btnNext.disabled = true;

      const page = await pdfDoc.getPage(num);

      // available size inside wrap
      const pad = 20; // safety padding
      const availW = Math.max(100, wrap.clientWidth - pad);
      const availH = Math.max(100, wrap.clientHeight - pad);

      // base viewport (scale 1)
      const viewport1 = page.getViewport({ scale: 1 });

      // compute scale to fit (contain)
      const scale = Math.min(availW / viewport1.width, availH / viewport1.height);

      const viewport = page.getViewport({ scale });

      // set canvas size in device pixels for crisp
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(viewport.width * dpr);
      canvas.height = Math.floor(viewport.height * dpr);
      canvas.style.width = Math.floor(viewport.width) + "px";
      canvas.style.height = Math.floor(viewport.height) + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = true;

      await page.render({ canvasContext: ctx, viewport }).promise;

      pageNum = num;
      pageInd.textContent = `${pageNum} / ${pageCount}`;

      btnPrev.disabled = (pageNum <= 1);
      btnNext.disabled = (pageNum >= pageCount);

      rendering = false;

      if (pendingPage !== null) {
        const p = pendingPage;
        pendingPage = null;
        renderPage(p);
      }
    }

    function queueRender(num) {
      if (rendering) {
        pendingPage = num;
      } else {
        renderPage(num);
      }
    }

    function clamp(n) {
      return Math.max(1, Math.min(pageCount, n));
    }

    function go(delta) {
      if (!pdfDoc) return;
      queueRender(clamp(pageNum + delta));
    }

    // =========================
    // UI events
    // =========================
    btnPrev.addEventListener("click", () => go(-1));
    btnNext.addEventListener("click", () => go(1));

    // keyboard
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
      if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
    }, { passive: false });

    // swipe
    let touchStartX = null;
    let touchStartY = null;
    window.addEventListener("touchstart", (e) => {
      if (!e.touches || !e.touches[0]) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener("touchend", (e) => {
      if (touchStartX === null || touchStartY === null) return;
      const t = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0] : null;
      if (!t) return;

      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;
      touchStartX = null;
      touchStartY = null;

      // horizontal swipe only
      if (Math.abs(dx) < 40) return;
      if (Math.abs(dy) > 80) return;

      if (dx > 0) go(-1);
      else go(1);
    }, { passive: true });

    // resize => rerender current page to keep fit
    let resizeTimer = null;
    window.addEventListener("resize", () => {
      if (!pdfDoc) return;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => queueRender(pageNum), 120);
    });

    // =========================
    // Boot
    // =========================
    async function boot() {
      if (!pdfUrl) {
        wrap.innerHTML =
          `<div class="error">
             Missing PDF parameter.<br/>
             Use <code>?file=PDF_URL</code> or <code>?unit=u01&lang=ph</code>.
           </div>`;
        return;
      }

      try {
        const loadingTask = pdfjsLib.getDocument({
          url: pdfUrl,
          withCredentials: false
        });

        pdfDoc = await loadingTask.promise;
        pageCount = pdfDoc.numPages;
        pageInd.textContent = `1 / ${pageCount}`;
        await renderPage(1);
      } catch (err) {
        wrap.innerHTML =
          `<div class="error">
             Failed to load PDF.<br/>
             <code>${String(pdfUrl).replace(/</g,"&lt;").replace(/>/g,"&gt;")}</code><br/>
             ${String(err).replace(/</g,"&lt;").replace(/>/g,"&gt;")}
           </div>`;
      }
    }

    boot();
  </script>
</body>
</html>
