<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EPS-TOPIK Unit 01 Slides</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#0b1220;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Pretendard,sans-serif;
}

.wrapper{
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#fff;
}

h1{
  font-size:20px;
  margin-bottom:20px;
  font-weight:900;
}

.lang-grid{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center;
}

.lang-btn{
  min-width:110px;
  padding:12px 16px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.05);
  color:#fff;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}
.lang-btn:hover{
  background:#2563eb;
  border-color:#2563eb;
}
.hint{
  margin-top:16px;
  font-size:12px;
  color:#94a3b8;
}
</style>
</head>

<body>
<div class="wrapper">
  <h1>EPS-TOPIK Unit 01 Slides</h1>

  <div class="lang-grid">
    <button class="lang-btn" onclick="go('ph')">PH (Tagalog)</button>
    <button class="lang-btn" onclick="go('vn')">VN (Vietnam)</button>
    <button class="lang-btn" onclick="go('np')">NP (Nepal)</button>
    <button class="lang-btn" onclick="go('mm')">MM (Myanmar)</button>
    <button class="lang-btn" onclick="go('id')">ID (Indonesia)</button>
  </div>

  <div class="hint">Download Protected · Page-Turn Mode</div>
</div>

<script>
function go(lang){
  location.href = `viewer.html?unit=u01&lang=${lang}`;
}
</script>
</body>
</html>
